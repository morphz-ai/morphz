[package]
name = "morphz"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
default-run = "morphz"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["context-db"]
experimental-cognitive-coordination = ["dep:morphz-cognitive-coordination"]
# ContextDB is the default cognitive Store. Keeping it as a named build feature
# lets deliberately minimal binaries omit the backend without presenting it as
# an experimental Runtime capability.
context-db = []
# Keep one canonical Structured Context seed and append ordered, structured
# ContextDelta blocks inside one User message. Provider adapters preserve the
# same block boundaries in their native content representation. The experiment
# remains compile-time opt-in so default Context semantics stay untouched.
experimental-structured-context-delta-cache = []

[[example]]
name = "context_db_sqlite_benchmark"
path = "examples/context_db_sqlite_benchmark.rs"
required-features = ["context-db"]

[[example]]
name = "context_db_runtime_benchmark"
path = "examples/context_db_runtime_benchmark.rs"
required-features = ["context-db"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
# Keep the provider/Edge transport self-contained on every supported platform.
# Reqwest's default native-tls feature requires pkg-config and OpenSSL headers on
# a fresh Linux host; Rustls with native roots preserves OS trust-store behavior
# without adding a platform C-toolchain dependency.
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
dashmap = "5.5"
futures-util = "0.3"
# Select SQLx's SQLite driver without its older bundled amalgamation;
# `libsqlite3-hotbundle` below is the single native implementation.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "_sqlite", "sqlx-sqlite", "postgres", "chrono", "json"] }
# SQLx 0.8.6's public `sqlite` feature bundles SQLite 3.46.0, which contains
# the WAL-reset race fixed in 3.51.3. Keep SQLx's FFI surface while making this
# current process-wide amalgamation the sole native implementation; startup and
# a link-level test verify the effective version.
libsqlite3-hotbundle = { version = "1.530300.0", features = ["unlock_notify"] }
# SQLx's unbundled driver normally generates bindings from the host header,
# which is too old on supported macOS images. Reuse its audited bundled
# bindings without enabling its bundled C implementation.
libsqlite3-sys = { version = "=0.30.1", default-features = false, features = ["bundled_bindings", "unlock_notify"] }
async-trait = "0.1"
tower-http = { version = "0.5", features = ["compression-gzip", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
log = "0.4"
toml = "0.8"
sha2 = "0.10"
walkdir = "2.5"
tar = "0.4"
glob = "0.3"
getrandom = "0.3"
keyring = "4.1.4"
zeroize = "1.8"
ring = "0.17.14"
rayon = "1.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "macros", "unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2"
unicode-normalization = "0.1"
# Word segmentation for Recall. SQLite FTS5 has no CJK-aware tokenizer, so the
# Runtime segments text itself and the physical index only splits on
# whitespace. `compiled_data` keeps the dictionaries in the binary.
icu_segmenter = "2.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
portable-pty = "0.9.0"
vt100 = "0.16.2"
clap = "4.5"
clap_complete = "4.5"
tempfile = "3.8"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
yao-lang = { path = "../yao" }
morphz-cognitive-coordination = { path = "../experiments/morphz-cognitive-coordination", optional = true, default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process", "poll", "fs"] }

[target.'cfg(windows)'.dependencies]
# Pinned to one audited upstream revision. Only the Windows target resolves
# this dependency; macOS/Linux builds do not carry the Windows subsystem.
codex-protocol = { git = "https://github.com/openai/codex", rev = "94cbbddafc1776d5e377bca1b05932c697e82238" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "94cbbddafc1776d5e377bca1b05932c697e82238" }
codex-utils-pty = { path = "../third_party/codex-utils-pty" }
morphz-windows-sandbox = { path = "../third_party/morphz-windows-sandbox" }
# Codex's audited lock pairs every Rama crate at alpha.4. Without these exact
# bounds Cargo may select stable 0.3.0 utility crates whose generated APIs are
# incompatible with rama-core and rama-http 0.3.0-alpha.4.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
