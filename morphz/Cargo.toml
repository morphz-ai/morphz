[package]
name = "morphz"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
default-run = "morphz"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
reqwest = { version = "0.11", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
dashmap = "5.5"
futures-util = "0.3"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "json"] }
# SQLx 0.8.6's `sqlite` feature bundles SQLite 3.46.0. That release contains
# the WAL-reset race fixed in 3.51.3. Keep SQLx's FFI surface and link a current
# process-wide amalgamation; startup and a link-level test verify which version
# actually won symbol resolution.
libsqlite3-hotbundle = "1.530300.0"
async-trait = "0.1"
tower-http = { version = "0.5", features = ["compression-gzip", "cors"] }
nix = { version = "0.31.3", features = ["signal", "process", "poll"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
toml = "0.8"
sha2 = "0.10"
walkdir = "2.5"
tar = "0.4"
glob = "0.3"
getrandom = "0.3"
keyring = "4.1.4"
zeroize = "1.8"
ring = "0.17.14"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "macros", "unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2"
unicode-normalization = "0.1"
# Word segmentation for Recall. SQLite FTS5 has no CJK-aware tokenizer, so the
# Runtime segments text itself and the physical index only splits on
# whitespace. `compiled_data` keeps the dictionaries in the binary.
icu_segmenter = "2.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
portable-pty = "0.9.0"
vt100 = "0.16.2"
clap = "4.5"
clap_complete = "4.5"

[dev-dependencies]
tempfile = "3.8"

[lints]
workspace = true
