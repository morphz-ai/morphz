[package]
name = "executor"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "executor"
path = "src/lib.rs"

[[bin]]
name = "executor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "io-util"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }
half = { version = ">=2.4.1", default-features = false }


