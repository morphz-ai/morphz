[workspace]
resolver = "2"
members = [
    "executor",
    "extensions/morphz-memory-vector",
    "morphz",
    "morphz-evals",
]
default-members = ["morphz"]

[workspace.package]
# The verified floor, not an aspiration: this is the version the toolchain
# file pins and the only one the suite is actually run against. Keep it in
# step with `rust-toolchain.toml`.
rust-version = "1.97.1"

[workspace.lints.rust]
# `libsqlite3-hotbundle` deliberately links a current SQLite amalgamation
# alongside the older one SQLx bundles, so duplicate symbols are the mechanism
# rather than a mistake, and a link-level test asserts which version actually
# won resolution. Rust 1.97 began surfacing linker stderr through this lint,
# which would otherwise fail the `-D warnings` build.
linker_messages = "allow"
