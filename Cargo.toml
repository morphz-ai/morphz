[workspace]
resolver = "2"
members = [
    "executor",
    "experiments/morphz-cognitive-coordination",
    "extensions/morphz-memory-vector",
    "morphz",
    "morphz-evals",
    "third_party/morphz-windows-sandbox",
    "tools/morphz-cli-docs",
    "yao",
]
exclude = [
    "third_party/codex-otel-stub",
    "third_party/codex-utils-absolute-path",
    "third_party/codex-utils-pty",
]
default-members = ["morphz"]

[workspace.package]
# The verified floor, not an aspiration: this is the version the toolchain
# file pins and the only one the suite is actually run against. Keep it in
# step with `rust-toolchain.toml`.
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/morphz-ai/morphz"
homepage = "https://morphz.ai"

[workspace.lints]

[patch."https://github.com/openai/codex"]
# The Windows sandbox crate uses Codex OTEL only for optional setup metrics.
# Morphz keeps its telemetry boundary independent and supplies the same tiny
# API as a deliberate no-op adapter instead of importing Codex's HTTP/OTEL
# stack into the product.
codex-otel = { path = "third_party/codex-otel-stub" }
# The sandbox command runner must start in non-interactive Windows sessions before any Shell32
# initialization. Keep the pinned path type API, but resolve `~` from the explicit environment so
# this low-level helper does not import SHGetKnownFolderPath during process bootstrap.
codex-utils-absolute-path = { path = "third_party/codex-utils-absolute-path" }
# Upstream's pinned Windows PTY implementation crosses a RawHandle boundary
# with two different c_void aliases. Keep the small crate local until the
# equivalent ABI fix is available in the Codex revision Morphz consumes.
codex-utils-pty = { path = "third_party/codex-utils-pty" }
