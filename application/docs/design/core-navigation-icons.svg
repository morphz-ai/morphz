    <text x="638" y="207">内容库</text>
    <text x="882" y="207">工作台</text>
    <text x="1126" y="207">项目</text>
  </g>
  <g text-anchor="middle" font-size="13" class="muted">
    <text x="150" y="230">交流</text>
    <text x="394" y="230">待办与进度</text>
    <text x="638" y="230">工作成果</text>
    <text x="882" y="230">开始与继续工作</text>
    <text x="1126" y="230">工作集合</text>
  </g>
  <g class="glyph light">
    <use href="#nav-dialogue" x="115.5" y="254.5" width="17" height="17"/>
    <use href="#nav-dialogue" x="163" y="251" width="24" height="24"/>
    <use href="#nav-matters" x="359.5" y="254.5" width="17" height="17"/>
    <use href="#nav-matters" x="407" y="251" width="24" height="24"/>
    <use href="#nav-content" x="603.5" y="254.5" width="17" height="17"/>
    <use href="#nav-content" x="651" y="251" width="24" height="24"/>
    <use href="#nav-workbench" x="847.5" y="254.5" width="17" height="17"/>
    <use href="#nav-workbench" x="895" y="251" width="24" height="24"/>
    <use href="#nav-projects" x="1091.5" y="254.5" width="17" height="17"/>
    <use href="#nav-projects" x="1139" y="251" width="24" height="24"/>
  </g>
  <g text-anchor="middle" class="small muted">
    <text x="124" y="294">17px</text><text x="175" y="294">24px</text>
    <text x="368" y="294">17px</text><text x="419" y="294">24px</text>
    <text x="612" y="294">17px</text><text x="663" y="294">24px</text>
    <text x="856" y="294">17px</text><text x="907" y="294">24px</text>
    <text x="1100" y="294">17px</text><text x="1151" y="294">24px</text>
  </g>
  <path d="M48 321H1232" stroke="#eef0f3"/>

  <text x="48" y="357" font-size="16" font-weight="600">亮色 · 实际大小</text>
  <text x="496" y="357" font-size="16" font-weight="600">暗色 · 实际大小</text>
  <!-- The previews are glyph reviews, not screenshots of a modified app. -->
  <g transform="translate(48 378)" class="light">
    <rect width="80" height="338" rx="12" fill="#fafafa" stroke="#e4e7ec"/>
    <use href="#morphz-mark" x="24" y="18" width="32" height="32" color="#3de1f5"/>
    <rect x="12" y="166" width="56" height="44" rx="8" fill="#e3f1f3"/>
    <g class="glyph">
      <use href="#nav-dialogue" x="28" y="88" width="24" height="24"/>
      <use href="#nav-matters" x="28" y="132" width="24" height="24"/>
      <use href="#nav-content" x="28" y="176" width="24" height="24" class="selected-light"/>
      <use href="#nav-workbench" x="28" y="220" width="24" height="24"/>
      <use href="#nav-projects" x="28" y="264" width="24" height="24"/>
    </g>
  </g>
  <g transform="translate(158 378)" class="light">
    <rect width="280" height="338" rx="12" fill="#fafafa" stroke="#e4e7ec"/>
    <use href="#morphz-mark" x="17" y="21" width="23" height="25" color="#3de1f5"/>
    <text x="50" y="41" font-size="19" font-weight="650">Morphz</text>
    <rect x="12" y="166" width="256" height="44" rx="8" fill="#e3f1f3"/>
    <g class="glyph">
      <use href="#nav-dialogue" x="22" y="91.5" width="17" height="17"/>
      <use href="#nav-matters" x="22" y="135.5" width="17" height="17"/>
      <use href="#nav-content" x="22" y="179.5" width="17" height="17" class="selected-light"/>
      <use href="#nav-workbench" x="22" y="223.5" width="17" height="17"/>
      <use href="#nav-projects" x="22" y="267.5" width="17" height="17"/>
    </g>
    <g class="nav-label">
      <text x="52" y="105">对话</text><text x="52" y="149">事项</text>
      <text x="52" y="193" style="fill:#168997;font-weight:600">内容库</text>
      <text x="52" y="237">工作台</text><text x="52" y="281">项目</text>
    </g>
  </g>
  <g transform="translate(496 378)" class="dark">
    <rect width="80" height="338" rx="12" fill="#242424"/>
    <use href="#morphz-mark" x="24" y="18" width="32" height="32" color="#56d0de"/>
    <rect x="12" y="166" width="56" height="44" rx="8" fill="#26373b"/>
    <g class="glyph">
      <use href="#nav-dialogue" x="28" y="88" width="24" height="24"/>
      <use href="#nav-matters" x="28" y="132" width="24" height="24"/>
      <use href="#nav-content" x="28" y="176" width="24" height="24" class="selected-dark"/>
      <use href="#nav-workbench" x="28" y="220" width="24" height="24"/>
