  <g transform="translate(606 378)" class="dark">
    <rect width="280" height="338" rx="12" fill="#242424"/>
    <use href="#morphz-mark" x="17" y="21" width="23" height="25" color="#56d0de"/>
    <text x="50" y="41" font-size="19" font-weight="650" style="fill:#f4f4f6">Morphz</text>
    <rect x="12" y="166" width="256" height="44" rx="8" fill="#26373b"/>
    <g class="glyph">
      <use href="#nav-dialogue" x="22" y="91.5" width="17" height="17"/>
      <use href="#nav-matters" x="22" y="135.5" width="17" height="17"/>
      <use href="#nav-content" x="22" y="179.5" width="17" height="17" class="selected-dark"/>
      <use href="#nav-workbench" x="22" y="223.5" width="17" height="17"/>
      <use href="#nav-projects" x="22" y="267.5" width="17" height="17"/>
    </g>
    <g class="nav-label">
      <text x="52" y="105">对话</text><text x="52" y="149">事项</text>
      <text x="52" y="193" style="fill:#56d0de;font-weight:600">内容库</text>
      <text x="52" y="237">工作台</text><text x="52" y="281">项目</text>
    </g>
  </g>
  <g transform="translate(936 378)">
    <text y="28" font-size="16" font-weight="600">统一，不雷同</text>
    <text y="62" font-size="14" class="muted">圆头、圆角、线条重量一致</text>
    <text y="88" font-size="14" class="muted">轮廓区分对象、应用与容器</text>
    <path d="M0 115H296" stroke="#eef0f3"/>
    <text y="153" font-size="16" font-weight="600">状态克制</text>
    <text y="187" font-size="14" class="muted">普通图标中性，选中用主题色</text>
    <text y="213" font-size="14" class="muted">不加渐变、阴影或额外外框</text>
    <path d="M0 240H296" stroke="#eef0f3"/>
    <text y="278" font-size="16" font-weight="600">Logo 保留品牌轮廓</text>
    <text y="312" font-size="14" class="muted">窄栏 32px · 导航 24px · 点击区 44px</text>
  </g>
  <text x="48" y="752" font-size="12" class="muted">仅设计提案；侧栏预览用于评审图形和比例，不是产品已更新的截图。</text>
  <path d="M48 791H1232" stroke="#eef0f3"/>
  <text x="48" y="828" font-size="22" font-weight="600">项目 · 保留文件夹，比较组织感</text>
  <text x="1232" y="826" text-anchor="end" font-size="13" class="muted">下方小图分别为 17px / 24px</text>
  <g class="glyph" color="#1f2024">
    <use href="#nav-projects" x="234" y="857" width="40" height="40"/>
    <use href="#projects-organized-folder" x="618" y="857" width="40" height="40"/>
    <use href="#projects-stacked-folders" x="1002" y="857" width="40" height="40"/>
  </g>
  <g text-anchor="middle" font-size="17" font-weight="600">
    <text x="254" y="929">原 A · 简洁文件夹</text>
    <text x="638" y="929">新候选 1 · 项目夹</text>
    <text x="1022" y="929">新候选 2 · 叠放项目夹</text>
  </g>
  <g text-anchor="middle" font-size="14" class="muted">
    <text x="254" y="956">最简洁，辨识成本低</text>
    <text x="638" y="956">两条工作项，强调组织</text>
    <text x="1022" y="956">多个项目，强调集合</text>
  </g>
  <g class="glyph light">
    <use href="#nav-projects" x="219.5" y="980.5" width="17" height="17"/>
    <use href="#nav-projects" x="267" y="977" width="24" height="24"/>
    <use href="#projects-organized-folder" x="603.5" y="980.5" width="17" height="17"/>
    <use href="#projects-organized-folder" x="651" y="977" width="24" height="24"/>
    <use href="#projects-stacked-folders" x="987.5" y="980.5" width="17" height="17"/>
    <use href="#projects-stacked-folders" x="1035" y="977" width="24" height="24"/>
  </g>
  <text x="48" y="1053" font-size="14" style="fill:#168997">我更看好候选 1：保留文件夹的辨识度，增加少量组织感；短线不表示进度。</text>
</svg>
