<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090" role="img" aria-labelledby="title description">
  <title id="title">Morphz 五个核心导航图标设计稿</title>
  <desc id="description">正式界面已采用名称内容库、工作台分区三卡及项目 A 普通文件夹；下方项目夹与叠放项目夹仅为未选候选。展示 24 像素收缩态与 17 像素展开态，以及明暗主题。本文件是矢量设计参照，不是实际应用截图。</desc>
  <defs>
    <!-- Transparent, currentColor glyphs. No background-colored occlusion,
         gradients, masks, text, or extra frame in the reusable symbols. -->
    <symbol id="nav-dialogue" viewBox="0 0 24 24">
      <path d="M21 11.4c0 4.7-4 8.6-9 8.6a9.5 9.5 0 0 1-4.2-1L3 21l1.2-4.5A8.1 8.1 0 0 1 3 11.4C3 6.8 7 3 12 3s9 3.8 9 8.4Z"/>
    </symbol>
    <symbol id="nav-matters" viewBox="0 0 24 24">
      <path d="m3 6 2.5 2.5L9 4.5M13 6.5h8M12 17h9"/>
      <circle cx="5.5" cy="17" r="2.5"/>
    </symbol>
    <symbol id="nav-content" viewBox="0 0 24 24">
      <path d="M17 5V4.5A1.5 1.5 0 0 0 15.5 3h-11A1.5 1.5 0 0 0 3 4.5v11A1.5 1.5 0 0 0 4.5 17H5"/>
      <rect x="7" y="7" width="14" height="14" rx="2.5"/>
      <path d="M11 12h6"/>
    </symbol>
    <symbol id="nav-workbench" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="18" rx="2"/>
      <rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="14" y="14" width="7" height="7" rx="2"/>
    </symbol>
    <symbol id="nav-projects" viewBox="0 0 24 24">
      <path d="M3 7a2 2 0 0 1 2-2h4.2a2 2 0 0 1 1.4.6L13 8h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
    </symbol>
    <symbol id="projects-organized-folder" viewBox="0 0 24 24">
      <path d="M3 7a2 2 0 0 1 2-2h4.2a2 2 0 0 1 1.4.6L13 8h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
      <path d="M7 12h10M7 16h6"/>
    </symbol>
    <symbol id="projects-stacked-folders" viewBox="0 0 24 24">
      <path d="M5 17H4.5A1.5 1.5 0 0 1 3 15.5V5a2 2 0 0 1 2-2h2.2a2 2 0 0 1 1.4.6L11 6h6"/>
      <path d="M7 10a2 2 0 0 1 2-2h2.2a2 2 0 0 1 1.4.6L15 11h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2Z"/>
    </symbol>
    <symbol id="morphz-mark" viewBox="0 0 96 96">
      <path fill="currentColor" stroke="none" d="M8 4 48 40 38 40 38 70 8 92Z M88 4 48 40 58 40 58 70 88 92Z"/>
    </symbol>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif; fill: #1f2024; }
      .glyph { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: #64666f; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 12px; }
      .nav-label { font-size: 14px; font-weight: 500; }
      .light { color: #64666f; }
      .dark { color: #a4a5ae; }
      .dark text { fill: #a4a5ae; }
      .selected-light { color: #168997; }
      .selected-dark { color: #56d0de; }
    </style>
  </defs>

  <rect width="1280" height="1090" fill="#fff"/>
  <text x="48" y="59" font-size="28" font-weight="650">Morphz 核心导航</text>
  <text x="48" y="89" font-size="14" class="muted">已确认：内容库、工作台分区图形 · 项目暂保留 A，继续选型</text>
  <text x="1232" y="58" text-anchor="end" font-size="13" class="muted">24 × 24 网格 / 2px 圆头线</text>

  <!-- Enlarged forms explain the silhouette; the next row is actual size. -->
  <g color="#1f2024" class="glyph">
    <use href="#nav-dialogue" x="130" y="133" width="40" height="40"/>
    <use href="#nav-matters" x="374" y="133" width="40" height="40"/>
    <use href="#nav-content" x="618" y="133" width="40" height="40"/>
    <use href="#nav-workbench" x="862" y="133" width="40" height="40"/>
    <use href="#nav-projects" x="1106" y="133" width="40" height="40"/>
