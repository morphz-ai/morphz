name: Isolated Linux sandbox service implementation

on:
  push:
    branches: [fix/full-application-regressions-20261021]
    paths:
      - tools/linux-sandbox/**
      - morphz/src/sandbox/**
      - morphz/src/sandbox.rs
      - morphz/src/terminal.rs
      - morphz/src/tool.rs
      - morphz/tests/native_sandbox_contract.rs
      - scripts/test_runtime_postgres_lib.py
      - .github/workflows/linux-sandbox-service.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-sandbox-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-admission:
    name: Installed service and actual Runtime exec / PTY
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphz
          POSTGRES_PASSWORD: morphz
          POSTGRES_DB: morphz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morphz -d morphz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_BUILD_JOBS: 2
      MORPHZ_REQUIRE_LINUX_SANDBOX_ATTACK_TEST: "1"
      MORPHZ_TEST_HOST_NETNS: /opt/morphz-sandbox-ci-host-netns
      MORPHZ_TEST_POSTGRES_URL: postgres://morphz:morphz@127.0.0.1:5432/morphz_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install distribution dependencies without changing global security settings
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor apparmor-utils libapparmor-dev libjson-c-dev bubblewrap gcc
      - name: Compile actual Runtime library and native contract tests
        run: cargo test --locked -p morphz --lib --test native_sandbox_contract --no-run --message-format=json > "$RUNNER_TEMP/runtime-test-artifacts.jsonl"
      - name: Prepare a readable host namespace handle for the transition-denial contract
        run: |
          test ! -e "$MORPHZ_TEST_HOST_NETNS"
          sudo install -m 0444 /dev/null "$MORPHZ_TEST_HOST_NETNS"
          sudo mount --bind /proc/self/ns/net "$MORPHZ_TEST_HOST_NETNS"
      - name: Install native test executables and real service using administrator setup
        run: |
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B tools/linux-sandbox/stage_runtime_tests.py "$RUNNER_TEMP/runtime-test-artifacts.jsonl"
          sudo /usr/bin/python3 -I -B tools/linux-sandbox/install.py --runtime /usr/local/libexec/morphz-runtime-ci/lib --runtime /usr/local/libexec/morphz-runtime-ci/native
          sudo systemctl daemon-reload
          sudo systemctl start morphz-sandbox.service
          for attempt in $(seq 1 100); do
            if [ -S /run/morphz-sandbox/control.sock ]; then break; fi
            sleep 0.1
          done
          test -S /run/morphz-sandbox/control.sock
      - name: Verify actual Runtime command admission and post-admission protected paths
        # Explicit bash adds pipefail; tee must never turn a failed native test green.
        shell: bash
        run: /usr/local/libexec/morphz-runtime-ci/native --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-admission.log"
      - name: Preserve early admission failures before the full inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/native-admission.log
          retention-days: 7
      - name: Verify unchanged original late-created protected-file PTY regression
        run: /usr/local/libexec/morphz-runtime-ci/lib terminal::tests::terminal_sandbox_denies_outside_writes_and_protected_files --exact --nocapture --test-threads=1
      - name: Verify actual Runtime private PTY and ordinary command session boundaries
        run: /usr/local/libexec/morphz-runtime-ci/lib sandbox::linux::tests::native_bubblewrap_only_private_pty_retains_controlling_terminal --exact --nocapture --test-threads=1
      - name: Run the complete Runtime library inventory through the installed implementation
        if: ${{ !cancelled() }}
        run: /usr/local/libexec/morphz-runtime-ci/lib --test-threads=1
      - name: Require real PostgreSQL approval, input and PTY contracts even after another failure
        if: ${{ !cancelled() }}
        env:
          MORPHZ_TEST_RUNTIME_LIB: /usr/local/libexec/morphz-runtime-ci/lib
        run: python3 scripts/test_runtime_postgres_lib.py
      - name: Preserve actual service diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/installed-sandbox-evidence"
          sudo journalctl -u morphz-sandbox.service --no-pager > "$RUNNER_TEMP/installed-sandbox-evidence/service.log"
          sudo dmesg | tail -300 > "$RUNNER_TEMP/installed-sandbox-evidence/kernel.log" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: installed-runtime-sandbox-${{ github.run_id }}
          path: ${{ runner.temp }}/installed-sandbox-evidence/
          retention-days: 7

  compiler-kernel:
    name: Typed compiler and actual AppArmor literal paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install distribution AppArmor without changing global security settings
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor apparmor-utils libapparmor-dev libjson-c-dev bubblewrap gcc
      - name: Verify strict typed policy and deterministic compilation
        run: python3 -B -m unittest discover -s tools/linux-sandbox -p 'test_*.py' -v
      - name: Verify generated policy against real enforcing kernel paths
        run: |
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B \
            tools/linux-sandbox/kernel_contract.py --uid "$(id -u)" --gid "$(id -g)" \
            --output "${{ runner.temp }}/linux-sandbox-compiler-kernel"
      - name: Verify kernel sender identity and negative same-UID callers
        if: ${{ !cancelled() }}
        run: |
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B \
            tools/linux-sandbox/peer_kernel_contract.py --uid "$(id -u)" --gid "$(id -g)" \
            --output "${{ runner.temp }}/linux-sandbox-peer-kernel"
      - name: Verify directory object pins without privileged filesystem access
        if: ${{ !cancelled() }}
        run: |
          env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B \
            tools/linux-sandbox/roots_kernel_contract.py \
            --output "${{ runner.temp }}/linux-sandbox-roots-kernel"
      - name: Verify native mount admission with distribution Bubblewrap
        if: ${{ !cancelled() }}
        run: |
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B \
            tools/linux-sandbox/mount_kernel_contract.py --uid "$(id -u)" --gid "$(id -g)" \
            --output "${{ runner.temp }}/linux-sandbox-mount-kernel"
      - name: Verify authenticated policy leases across owner exit and service crash
        if: ${{ !cancelled() }}
        run: |
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B \
            tools/linux-sandbox/lifecycle_kernel_contract.py --uid "$(id -u)" --gid "$(id -g)" \
            --output "${{ runner.temp }}/linux-sandbox-lifecycle-kernel"
      - name: Archive literal filenames without removing boundary cases
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/linux-sandbox-evidence"
          for component in linux-sandbox-compiler-kernel linux-sandbox-peer-kernel linux-sandbox-roots-kernel linux-sandbox-mount-kernel linux-sandbox-lifecycle-kernel; do
            if [ -d "${{ runner.temp }}/$component" ]; then
              sudo tar -czf "${{ runner.temp }}/linux-sandbox-evidence/$component.tar.gz" \
                -C "${{ runner.temp }}" "$component"
            fi
          done
      - name: Preserve failed and successful kernel evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-sandbox-compiler-kernel-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-sandbox-evidence/*.tar.gz
          if-no-files-found: warn
          retention-days: 7
