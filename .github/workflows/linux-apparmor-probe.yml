name: Isolated Linux AppArmor Feasibility

on:
  push:
    branches:
      - "probe/linux-apparmor-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-linux-apparmor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Synthetic live-path protection (not production adoption)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor apparmor-utils
      - name: Static probe harness checks
        run: python3 -B -m unittest discover -s scripts/probes/linux_apparmor -p 'test_probe.py' -v
      - name: Run synthetic isolation experiment
        env:
          MORPHZ_ISOLATED_APPARMOR_PROBE: "1"
        run: |
          python3 -B scripts/probes/linux_apparmor/probe.py \
            --output "${{ runner.temp }}/morphz-apparmor-evidence"
      - name: Preserve every result including failed probes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-linux-apparmor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morphz-apparmor-evidence
          if-no-files-found: warn
          retention-days: 7
