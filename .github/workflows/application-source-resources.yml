name: Application source resource diagnosis

on:
  workflow_dispatch:
    inputs:
      native_probes:
        description: Run isolated Linux native-window and timing regressions instead of source diagnostics
        type: boolean
        default: false
  workflow_call:
    inputs:
      native_probes:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-contracts:
    if: ${{ !inputs.native_probes }}
    name: Isolated native compiler and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - name: Run the exact synchronous source audits with resource observations
        run: |
          node ../scripts/observe-ci-resources.mjs 5000 &
          resource_observer=$!
          trap 'kill "$resource_observer" 2>/dev/null || true; wait "$resource_observer" 2>/dev/null || true' EXIT
          node --import tsx --test --test-concurrency=4 \
            tests/assert-syntax-identity.test.ts \
            tests/virtual-typescript.test.ts \
            tests/application-navigation-consumption-boundary.test.ts \
            tests/application-navigation-ownership.test.ts \
            tests/builtin-application-adapters-boundary.test.ts

  linux-native-regressions:
    if: ${{ inputs.native_probes }}
    name: Isolated Linux native and timing regression diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Select isolated cognitive dependency cache
        run: printf 'MORPHZ_TEST_COGNITIVE_NPM_CACHE=%s/morphz-cognitive-npm-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm exec --offline -- tsx scripts/prepare-cognitive-author-dependencies.ts
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-client-16 xvfb xauth
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Keep original assertions and real native display authorization
        env:
          MORPHZ_TEST_REQUIRED_CAPABILITIES: postgres
        run: |
          xvfb-run -a npm test -- \
            tests/native-test-environment.test.ts \
            tests/browser-clock-boundary.test.ts \
            tests/cognitive-document-native.test.ts \
            tests/cognitive-notes-native-embedded.test.ts \
            tests/cognitive-notes-native-production.test.ts \
            tests/composer-creation-native.test.ts \
            tests/markdown-text-block-mounted.test.ts \
            tests/script-workspace-controller-mounted.test.ts \
            tests/task-run-panel-mounted.test.ts \
            tests/execution-inspection-mounted.test.ts \
            tests/cognitive-app-document-local.test.ts
