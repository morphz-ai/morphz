name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  MORPHZ_BUILD_GIT_COMMIT: ${{ github.sha }}

jobs:
  session-io:
    needs: [validate-tag, complete-ci]
    uses: ./.github/workflows/session-io.yml

  linux-sandbox:
    needs: [validate-tag, complete-ci]
    uses: ./.github/workflows/linux-sandbox-service.yml

  validate-tag:
    name: Validate release ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      tag: ${{ steps.policy.outputs.tag }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      make_latest: ${{ steps.policy.outputs.make_latest }}
      release_branch: ${{ steps.policy.outputs.release_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Prepare the locked SemVer parser
        run: npm ci --prefix dashboard --ignore-scripts
      - name: Match canonical SemVer tag to Cargo package version
        id: policy
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("morphz/Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$RELEASE_EVENT" != "push" ]]; then
            echo "dry-run release validation for v$package_version at $GITHUB_SHA"
            RELEASE_TAG="v$package_version"
          fi
          node scripts/release-policy.cjs "$package_version" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  complete-ci:
    name: Same-commit complete CI admission
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require latest successful full push CI from the canonical branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.validate-tag.outputs.release_branch }}
        run: |
          set -euo pipefail
          python3 -B scripts/verify-release-ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --branch "$RELEASE_BRANCH" | tee release-ci-admission.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ci-admission
          path: release-ci-admission.json
          if-no-files-found: error

  release-readiness:
    name: Release readiness
    needs: [validate-tag, complete-ci]
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      MORPHZ_REQUIRE_LINUX_SANDBOX_ATTACK_TEST: "1"
      MORPHZ_TEST_HOST_NETNS: /opt/morphz-sandbox-ci-host-netns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install native sandbox dependencies without global security changes
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor apparmor-utils libapparmor-dev libjson-c-dev gcc
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Audit Rust dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          bash scripts/audit-rust-dependencies.sh
      - name: Verify locked Rust license bundle
        run: python3 scripts/generate-third-party-licenses.py rust --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Verify locked Dashboard license bundle
        run: |
          npm ci --prefix dashboard
          python3 scripts/generate-third-party-licenses.py dashboard --check
      - name: Verify source and installer contracts
        run: |
          cargo fmt --all -- --check
          bash scripts/check-source-language.sh
          perl scripts/check-core-protocol-language.pl
          perl scripts/check-diagnostic-logs.pl
          cmp scripts/install.sh website/public/install.sh
          sh scripts/test_install.sh
          python3 -B -m unittest discover -s tools/linux-sandbox -p 'test_*.py' -v
      - name: Compile and install exact release-critical sandbox test images
        run: |
          test ! -e "$MORPHZ_TEST_HOST_NETNS"
          sudo install -m 0444 /dev/null "$MORPHZ_TEST_HOST_NETNS"
          sudo mount --bind /proc/self/ns/net "$MORPHZ_TEST_HOST_NETNS"
          cargo test --locked -p morphz --lib --bin morphz --test session_io --test native_sandbox_contract --no-run --message-format=json > "$RUNNER_TEMP/release-test-artifacts.jsonl"
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B tools/linux-sandbox/stage_runtime_tests.py "$RUNNER_TEMP/release-test-artifacts.jsonl" --install-service
          sudo systemctl daemon-reload
          sudo systemctl start morphz-sandbox.service
          for _ in $(seq 1 100); do
            if [ -S /run/morphz-sandbox/control.sock ]; then break; fi
            sleep 0.1
          done
          test -S /run/morphz-sandbox/control.sock
      - name: Run release-critical tests
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/python3 -I -B ${{ github.workspace }}/tools/linux-sandbox/run_runtime_test.py
        run: cargo test --locked -p morphz --lib --bin morphz --test session_io --test native_sandbox_contract --no-fail-fast -- --test-threads=1
      - name: Reject compiler and Clippy warnings
        run: cargo clippy --locked -p morphz --all-targets --all-features -- -D warnings
      - name: Preserve installed sandbox diagnostics
        if: failure()
        run: sudo journalctl -u morphz-sandbox.service --no-pager

  linux-bundles:
    name: ${{ matrix.asset }}
    needs: [validate-tag, complete-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: morphz-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: morphz-linux-aarch64
    runs-on: ${{ matrix.os }}
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            build-essential ca-certificates clang cmake curl git libssl-dev \
            perl pkg-config bubblewrap python3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release binaries
        run: cargo build --locked --release --target "${{ matrix.target }}" -p morphz --bin morphz --bin morphz-edge
      - name: Package release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/morphz-bundle
          cp "target/${{ matrix.target }}/release/morphz" dist/morphz-bundle/
          sh scripts/stage-release-legal.sh dist/morphz-bundle
          python3 tools/linux-sandbox/package.py dist/morphz-bundle
          archive="${{ matrix.asset }}.tar.gz"
          tar -czf "dist/$archive" -C dist/morphz-bundle \
            morphz LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES_RUST.md \
            dashboard third_party linux-sandbox
          edge_asset="${{ matrix.asset }}"
          edge_asset="morphz-edge-${edge_asset#morphz-}.tar.gz"
          mkdir -p dist/morphz-edge-bundle
          cp "target/${{ matrix.target }}/release/morphz-edge" dist/morphz-edge-bundle/
          sh scripts/stage-release-legal.sh dist/morphz-edge-bundle
          python3 tools/linux-sandbox/package.py dist/morphz-edge-bundle
          tar -czf "dist/$edge_asset" -C dist/morphz-edge-bundle \
            morphz-edge LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES_RUST.md \
            dashboard third_party linux-sandbox
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive" > "$archive.sha256")
            (cd dist && sha256sum "$edge_asset" > "$edge_asset.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
            (cd dist && shasum -a 256 "$edge_asset" > "$edge_asset.sha256")
          fi
      - name: Verify packaged Linux runtime and compatibility floor
        shell: bash
        run: |
          set -euo pipefail
          "dist/morphz-bundle/morphz" --version
          python3 scripts/test-session-io-release.py dist/morphz-bundle/morphz
          required_glibc="$({ objdump -T dist/morphz-bundle/morphz || true; } \
            | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' \
            | sort -V \
            | tail -n 1)"
          test -n "$required_glibc"
          oldest="$(printf '%s\n' "$required_glibc" '2.35' | sort -V | head -n 1)"
          if [[ "$oldest" != "$required_glibc" ]]; then
            echo "release binary requires GLIBC_$required_glibc; maximum supported floor is GLIBC_2.35" >&2
            exit 1
          fi
          install_root="$RUNNER_TEMP/morphz-install-smoke"
          MORPHZ_RELEASE_BASE_URL="file://$PWD/dist" \
          MORPHZ_VERSION="${{ needs.validate-tag.outputs.tag }}" \
          MORPHZ_INSTALL_DIR="$install_root" \
          MORPHZ_NO_MODIFY_PATH=1 \
            sh scripts/install.sh
          "$install_root/morphz" --version
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | grep -Fx THIRD_PARTY_NOTICES.md
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | grep -Fx THIRD_PARTY_LICENSES_RUST.md
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | grep -Fx dashboard/THIRD_PARTY_LICENSES.md
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | grep -Fx third_party/morphz-windows-sandbox/NOTICE
          edge_asset="${{ matrix.asset }}"
          edge_asset="morphz-edge-${edge_asset#morphz-}.tar.gz"
          tar -tzf "dist/$edge_asset" | grep -Fx morphz-edge
          tar -tzf "dist/$edge_asset" | grep -Fx THIRD_PARTY_LICENSES_RUST.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
            dist/morphz-edge-*.tar.gz
            dist/morphz-edge-*.tar.gz.sha256
          if-no-files-found: error

  linux-bundle-sandbox:
    name: Installed release sandbox (${{ matrix.architecture }})
    needs: linux-bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morphz-linux-${{ matrix.architecture }}
          path: dist
      - name: Install distribution dependencies without changing global security settings
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor apparmor-utils libapparmor-dev libjson-c-dev bubblewrap gcc libc6-dev binutils
      - name: Install exact packaged Runtime and source components in this isolated runner
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          runtime_image="/usr/local/libexec/morphz-release-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          edge_image="/usr/local/libexec/morphz-edge-release-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$runtime_image"
          test ! -e "$edge_image"
          (cd dist && sha256sum -c "morphz-linux-$ARCHITECTURE.tar.gz.sha256")
          (cd dist && sha256sum -c "morphz-edge-linux-$ARCHITECTURE.tar.gz.sha256")
          sudo install -d -m 0755 "$runtime_image" "$edge_image"
          sudo tar --no-same-owner -xzf "dist/morphz-linux-$ARCHITECTURE.tar.gz" -C "$runtime_image"
          sudo tar --no-same-owner -xzf "dist/morphz-edge-linux-$ARCHITECTURE.tar.gz" -C "$edge_image"
          diff -r "$runtime_image/linux-sandbox" "$edge_image/linux-sandbox"
          sudo /usr/bin/python3 -I -B "$runtime_image/linux-sandbox/install.py" \
            --runtime "$runtime_image/morphz" --runtime "$edge_image/morphz-edge"
          sudo systemctl daemon-reload
          sudo systemctl start morphz-sandbox.service
          echo "MORPHZ_PACKAGED_RUNTIME=$runtime_image/morphz" >> "$GITHUB_ENV"
          for _ in $(seq 1 100); do
            if [ -S /run/morphz-sandbox/control.sock ]; then break; fi
            sleep 0.1
          done
          test -S /run/morphz-sandbox/control.sock
          "$edge_image/morphz-edge" --version
      - name: Verify packaged public Runtime admission and late-file protection without a model
        run: python3 scripts/test-session-io-release.py "$MORPHZ_PACKAGED_RUNTIME" --native-linux-sandbox
      - name: Preserve actual packaged service diagnostics
        if: always()
        run: sudo journalctl -u morphz-sandbox.service --no-pager

  macos-bundles:
    name: ${{ matrix.asset }}
    needs: [validate-tag, complete-ci]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: morphz-macos-aarch64
            file_arch: arm64
          - target: x86_64-apple-darwin
            asset: morphz-macos-x86_64
            file_arch: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release binaries
        run: cargo build --locked --release --target "${{ matrix.target }}" -p morphz --bin morphz --bin morphz-edge
      - name: Package release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/morphz-bundle
          cp "target/${{ matrix.target }}/release/morphz" dist/morphz-bundle/
          sh scripts/stage-release-legal.sh dist/morphz-bundle
          archive="${{ matrix.asset }}.tar.gz"
          tar -czf "dist/$archive" -C dist/morphz-bundle \
            morphz LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES_RUST.md \
            dashboard third_party
          edge_asset="${{ matrix.asset }}"
          edge_asset="morphz-edge-${edge_asset#morphz-}.tar.gz"
          mkdir -p dist/morphz-edge-bundle
          cp "target/${{ matrix.target }}/release/morphz-edge" dist/morphz-edge-bundle/
          sh scripts/stage-release-legal.sh dist/morphz-edge-bundle
          tar -czf "dist/$edge_asset" -C dist/morphz-edge-bundle \
            morphz-edge LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES_RUST.md \
            dashboard third_party
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          (cd dist && shasum -a 256 "$edge_asset" > "$edge_asset.sha256")
      - name: Verify packaged macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" \
            | grep -Fx morphz
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | grep -Fx THIRD_PARTY_NOTICES.md
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | grep -Fx THIRD_PARTY_LICENSES_RUST.md
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | grep -Fx dashboard/THIRD_PARTY_LICENSES.md
          tar -tzf "dist/${{ matrix.asset }}.tar.gz" | grep -Fx third_party/morphz-windows-sandbox/NOTICE
          edge_asset="${{ matrix.asset }}"
          edge_asset="morphz-edge-${edge_asset#morphz-}.tar.gz"
          tar -tzf "dist/$edge_asset" | grep -Fx morphz-edge
          tar -tzf "dist/$edge_asset" | grep -Fx THIRD_PARTY_LICENSES_RUST.md
          otool -l "dist/morphz-bundle/morphz" \
            | awk '/LC_BUILD_VERSION/{build=1} build && /minos 11\.0/{compatible=1} END{exit !compatible}'
          host_arch="$(uname -m)"
          if [[ "$host_arch" == '${{ matrix.file_arch }}' ]]; then
            "dist/morphz-bundle/morphz" --version
            python3 scripts/test-session-io-release.py dist/morphz-bundle/morphz
            install_root="$RUNNER_TEMP/morphz-install-smoke"
            MORPHZ_RELEASE_BASE_URL="file://$PWD/dist" \
            MORPHZ_VERSION="${{ needs.validate-tag.outputs.tag }}" \
            MORPHZ_INSTALL_DIR="$install_root" \
            MORPHZ_NO_MODIFY_PATH=1 \
              sh scripts/install.sh
            "$install_root/morphz" --version
          else
            file "dist/morphz-bundle/morphz" | grep -F '${{ matrix.file_arch }}'
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
            dist/morphz-edge-*.tar.gz
            dist/morphz-edge-*.tar.gz.sha256
          if-no-files-found: error

  windows-bundle:
    name: morphz-windows-x86_64
    needs: [validate-tag, complete-ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify real Windows stable and RC installer behavior
        shell: pwsh
        run: ./scripts/test_install.ps1
      - name: Build release binaries and sandbox helpers
        # Explicit bash stops on either Cargo failure; PowerShell's final native
        # exit code alone can hide a failed Runtime build behind successful helpers.
        shell: bash
        run: |
          cargo build --locked --release -p morphz --bin morphz --bin morphz-edge --bin morphz-windows-sandbox-runner
          cargo build --locked --release -p morphz-windows-sandbox --bins
      - name: Package release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "dist/morphz-bundle"
          $edgeBundle = "dist/morphz-edge-bundle"
          New-Item -ItemType Directory -Force $bundle, $edgeBundle | Out-Null
          function Copy-LegalFiles {
            param([string]$Destination)
            Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES_RUST.md $Destination -Force
            New-Item -ItemType Directory -Force "$Destination/dashboard" | Out-Null
            Copy-Item dashboard/THIRD_PARTY_LICENSES.md "$Destination/dashboard/" -Force
            @(
              "third_party/codex-otel-stub/NOTICE",
              "third_party/codex-utils-absolute-path/LICENSE",
              "third_party/codex-utils-absolute-path/UPSTREAM.md",
              "third_party/codex-utils-pty/LICENSE",
              "third_party/codex-utils-pty/NOTICE",
              "third_party/codex-utils-pty/UPSTREAM.md",
              "third_party/morphz-windows-sandbox/LICENSE",
              "third_party/morphz-windows-sandbox/NOTICE",
              "third_party/morphz-windows-sandbox/UPSTREAM.md",
              "third_party/sqlx-core-0.8.6/LICENSE-APACHE",
              "third_party/sqlx-core-0.8.6/LICENSE-MIT",
              "third_party/sqlx-core-0.8.6/UPSTREAM.md"
            ) | ForEach-Object {
              $destinationDirectory = Join-Path $Destination (Split-Path $_ -Parent)
              New-Item -ItemType Directory -Force $destinationDirectory | Out-Null
              Copy-Item $_ $destinationDirectory -Force
            }
          }
          @(
            "morphz.exe",
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe"
          ) | ForEach-Object {
            Copy-Item "target/release/$_" "$bundle/$_" -Force
          }
          Copy-LegalFiles $bundle
          @(
            "morphz-edge.exe",
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe"
          ) | ForEach-Object {
            Copy-Item "target/release/$_" "$edgeBundle/$_" -Force
          }
          Copy-LegalFiles $edgeBundle
          $archive = "morphz-windows-x86_64.zip"
          $edgeArchive = "morphz-edge-windows-x86_64.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/$archive" -Force
          Compress-Archive -Path "$edgeBundle/*" -DestinationPath "dist/$edgeArchive" -Force
          @($archive, $edgeArchive) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$_").Hash.ToLowerInvariant()
            "$hash  $_" | Set-Content -NoNewline "dist/$_.sha256"
          }
      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smoke = Join-Path $env:RUNNER_TEMP "morphz-release-smoke"
          Expand-Archive -LiteralPath "dist/morphz-windows-x86_64.zip" -DestinationPath $smoke
          & (Join-Path $smoke "morphz.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "packaged morphz.exe failed its version smoke test"
          }
          python scripts/test-session-io-release.py (Join-Path $smoke "morphz.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "packaged Runtime failed stable Session IO acceptance"
          }
          @(
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES_RUST.md",
            "dashboard/THIRD_PARTY_LICENSES.md",
            "third_party/morphz-windows-sandbox/NOTICE"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $smoke $_))) {
              throw "packaged Windows runtime is missing $_"
            }
          }
          $edgeSmoke = Join-Path $env:RUNNER_TEMP "morphz-edge-release-smoke"
          Expand-Archive -LiteralPath "dist/morphz-edge-windows-x86_64.zip" -DestinationPath $edgeSmoke
          @(
            "morphz-edge.exe",
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES_RUST.md"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $edgeSmoke $_))) {
              throw "packaged Windows Edge runtime is missing $_"
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morphz-windows-x86_64
          path: |
            dist/morphz-windows-x86_64.zip
            dist/morphz-windows-x86_64.zip.sha256
            dist/morphz-edge-windows-x86_64.zip
            dist/morphz-edge-windows-x86_64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [validate-tag, complete-ci, release-readiness, session-io, linux-sandbox, linux-bundles, linux-bundle-sandbox, macos-bundles, windows-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: morphz-*
          merge-multiple: true
      - name: Add installers
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
          RELEASE_MAKE_LATEST: ${{ needs.validate-tag.outputs.make_latest }}
          RELEASE_BRANCH: ${{ needs.validate-tag.outputs.release_branch }}
        run: |
          set -euo pipefail
          # Recheck after packaging too: neither a moved tag nor a subsequent
          # failed/cancelled CI attempt may borrow the admission from hours ago.
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          python3 -B scripts/verify-release-ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --branch "$RELEASE_BRANCH" > dist/release-ci-admission.json
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; release assets are immutable" >&2
            exit 1
          fi
          notes_args=(--generate-notes)
          release_notes_path="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$release_notes_path" ]]; then
            notes_args=(--notes-file "$release_notes_path")
          fi
          channel_args=(--latest="$RELEASE_MAKE_LATEST")
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            channel_args+=(--prerelease)
          fi
          # A normal command must succeed before mapfile consumes its output.
          # Process substitution would hide a failed producer's exit status.
          python3 -B scripts/verify-release-assets.py dist > "$RUNNER_TEMP/release-assets.txt"
          mapfile -t release_assets < "$RUNNER_TEMP/release-assets.txt"
          test "${#release_assets[@]}" -eq 23
          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            "${channel_args[@]}" \
            "${notes_args[@]}"
