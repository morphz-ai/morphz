name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      conversation_profile:
        description: Capture additional isolated conversation render profiles
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  conversation-profile:
    # New branch-only workflows cannot be dispatched by filename until they
    # exist on the default branch. An explicit option on this existing entry
    # calls the same-ref diagnostic workflow; all ordinary CI jobs still run.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.conversation_profile }}
    uses: ./.github/workflows/conversation-performance-diagnostics.yml

  application-source-resources:
    uses: ./.github/workflows/application-source-resources.yml

  session-io:
    uses: ./.github/workflows/session-io.yml

  native-regressions:
    uses: ./.github/workflows/application-native-regressions.yml

  linux-sandbox-service:
    uses: ./.github/workflows/linux-sandbox-service.yml

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify dependency audit refusal boundaries
        run: bash scripts/test_audit_rust_dependencies.sh
      - name: Verify cache retention and real Cargo lock boundaries
        run: python3 -m unittest discover -s scripts/tests -p test_prune_cargo_target.py -v
      - name: Verify required PostgreSQL library coverage
        run: python3 -m unittest discover -s scripts/tests -p test_runtime_postgres_ci.py -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Verify release isolation and exact-commit CI admission
        run: |
          npm ci --prefix dashboard --ignore-scripts
          node --test scripts/tests/release-policy.test.cjs
          python3 -B -m unittest discover -s scripts/tests -p 'test_release_*.py' -v
      - name: Verify deterministic Linux policy and exact installed-test inventory
        run: python3 -B -m unittest discover -s tools/linux-sandbox -p 'test_*.py' -v
      - name: Audit Rust dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          bash scripts/audit-rust-dependencies.sh
      - name: Verify locked Rust license bundle
        run: python3 scripts/generate-third-party-licenses.py rust --check
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Source language check
        run: bash scripts/check-source-language.sh
      - name: Core protocol language check
        run: perl scripts/check-core-protocol-language.pl
      - name: Diagnostic log contract check
        run: perl scripts/check-diagnostic-logs.pl
      - name: Signed Edge installer contract
        run: sh scripts/edge/test_install.sh
      - name: Main release installer contract
        run: |
          cmp scripts/install.sh website/public/install.sh
          sh scripts/test_install.sh
      - name: Clippy
        run: cargo clippy --all-targets --all-features --keep-going -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphz
          POSTGRES_PASSWORD: morphz
          POSTGRES_DB: morphz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morphz -d morphz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Bound linker concurrency; dev/test debug settings live in Cargo.toml.
      CARGO_BUILD_JOBS: 2
      # The full workspace includes PostgreSQL lifecycle conformance. Give it
      # an owned job-local database instead of skipping it or borrowing state.
      MORPHZ_TEST_POSTGRES_URL: postgres://morphz:morphz@127.0.0.1:5432/morphz_test
      MORPHZ_REQUIRE_LINUX_SANDBOX_ATTACK_TEST: "1"
      MORPHZ_TEST_HOST_NETNS: /opt/morphz-sandbox-ci-host-netns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Install native sandbox dependencies without global security changes
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor apparmor-utils libapparmor-dev libjson-c-dev gcc
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Compile the whole workspace and install exact sandbox test images
        run: |
          test ! -e "$MORPHZ_TEST_HOST_NETNS"
          sudo install -m 0444 /dev/null "$MORPHZ_TEST_HOST_NETNS"
          sudo mount --bind /proc/self/ns/net "$MORPHZ_TEST_HOST_NETNS"
          cargo test --locked --all --no-run --message-format=json > "$RUNNER_TEMP/workspace-test-artifacts.jsonl"
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B tools/linux-sandbox/stage_runtime_tests.py "$RUNNER_TEMP/workspace-test-artifacts.jsonl" --workspace --install-service
          sudo systemctl daemon-reload
          sudo systemctl start morphz-sandbox.service
          for _ in $(seq 1 100); do
            if [ -S /run/morphz-sandbox/control.sock ]; then break; fi
            sleep 0.1
          done
          test -S /run/morphz-sandbox/control.sock
      - name: Run tests
        # Runtime tests exercise real SQLite transactions, timers, sockets,
        # and process groups. Compile in parallel above, but run test cases in
        # a deterministic order so hosted-runner scheduling cannot manufacture
        # database-lock and wall-clock failures between otherwise isolated
        # harnesses. Tests that verify concurrency still spawn it internally.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/python3 -I -B ${{ github.workspace }}/tools/linux-sandbox/run_runtime_test.py
        run: ./scripts/cargo-dev.sh test --locked --all --verbose --no-fail-fast -- --test-threads=1
      - name: Require five exact clock-independent Context encoding passes
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/python3 -I -B ${{ github.workspace }}/tools/linux-sandbox/run_runtime_test.py
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5; do
            printf 'Context encoding clock pass %s/5\n' "$round"
            log="$RUNNER_TEMP/context-clock-$round.log"
            cargo test --locked -p morphz --lib orchestrator::context::tests::custom_survives_measurement_and_recovery_without_changing_empty_encoding -- --exact --test-threads=1 | tee "$log"
            python3 -c 'from pathlib import Path; import sys; sys.exit(0 if any(line.startswith("test result: ok. 1 passed; 0 failed;") for line in Path(sys.argv[1]).read_text().splitlines()) else "The exact Context clock fixture did not run successfully")' "$log"
          done
      - name: Require five complete native question cold-restart passes
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/python3 -I -B ${{ github.workspace }}/tools/linux-sandbox/run_runtime_test.py
        run: |
          for round in 1 2 3 4 5; do
            printf 'Native question cold-restart pass %s/5\n' "$round"
            cargo test --locked -p morphz --test user_input_runtime -- --test-threads=1
          done
      - name: Require ignored PostgreSQL approval, input and terminal contracts
        # A default-suite failure must remain a failure without suppressing the
        # independent database contracts. The runner rejects zero-test passes.
        if: ${{ !cancelled() }}
        env:
          MORPHZ_TEST_RUNTIME_LIB: /usr/local/libexec/morphz-runtime-ci/lib
        run: python3 scripts/test_runtime_postgres_lib.py
      - name: Require five complete PostgreSQL statement-budget passes
        if: ${{ !cancelled() }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/python3 -I -B ${{ github.workspace }}/tools/linux-sandbox/run_runtime_test.py
        run: |
          for round in 1 2 3 4 5; do
            printf 'PostgreSQL statement-budget pass %s/5\n' "$round"
            cargo test --locked -p morphz --test postgres_storage_statement_budget -- --test-threads=1 --nocapture
          done
      - name: Preserve installed sandbox diagnostics
        if: failure()
        run: sudo journalctl -u morphz-sandbox.service --no-pager

  postgres-conformance:
    name: PostgreSQL Runtime Store
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphz
          POSTGRES_PASSWORD: morphz
          POSTGRES_DB: morphz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morphz -d morphz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MORPHZ_TEST_POSTGRES_URL: postgres://morphz:morphz@127.0.0.1:5432/morphz_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run PostgreSQL conformance tests
        run: cargo test -p morphz --test runtime_store_conformance -- --nocapture
      - name: Verify typed interrupt delivery on SQLite and PostgreSQL
        run: cargo test --locked -p morphz --test typed_io_interrupt -- --include-ignored --nocapture
      - name: Verify atomic initial Session evaluation on SQLite and PostgreSQL
        if: ${{ !cancelled() }}
        run: cargo test --locked -p morphz --test session_initial_evaluation -- --include-ignored --nocapture
      - name: Require ignored PostgreSQL ownership and recovery integration contracts
        if: ${{ !cancelled() }}
        run: python3 scripts/test_runtime_postgres_lib.py --integration

  native-sandbox-macos:
    name: Native Sandbox (macOS)
    # The long arm64 job also failed allocation before executing any step
    # (40342793588 / 121641670890). Run every native Rust case on the same
    # macOS 26 standard Intel fleet as the full application inventory; the
    # dedicated Reader/GUI jobs retain actual Apple Silicon execution.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify native sandbox boundary
        run: cargo test -p morphz sandbox::tests -- --nocapture
      - name: Verify stable Session IO on macOS
        run: |
          cargo test --locked -p morphz --lib session_io:: -- --test-threads=1
          cargo test --locked -p morphz --test session_io -- --test-threads=1
      - name: Verify one-shot approval boundary
        run: cargo test -p morphz tool::tests::exec_ -- --nocapture
      - name: Verify selected-route Provider recovery
        run: |
          cargo test --locked -p morphz --lib --test attempt_loop --no-fail-fast provider_wait_resources_ -- --test-threads=1
          cargo test --locked -p morphz --test attempt_loop provider_wait_survives_runtime_restart -- --exact
          cargo test --locked -p morphz --test attempt_loop thread_evaluation_policy_committed_without_wake_is_recovered_after_restart -- --exact
      - name: Verify signed Edge installer contract
        run: sh scripts/edge/test_install.sh
      - name: Stage the exact native-tested macOS development Runtime
        # Keep the already-tested binary for original-app acceptance when the
        # developer machine cannot afford a second full Rust build. This is a
        # short-lived CI artifact, not a signed release or automatic deployment.
        shell: bash
        run: |
          set -euo pipefail
          test -x target/debug/morphz
          expected_commit="$(git rev-parse --short=12 HEAD)"
          version="$(target/debug/morphz --version)"
          case "$version" in
            *"$expected_commit"*) ;;
            *) echo "The native-tested Runtime has a different source identity" >&2; exit 1 ;;
          esac
          destination="$RUNNER_TEMP/morphz-macos-development-runtime"
          test ! -e "$destination"
          mkdir "$destination"
          install -m 0755 target/debug/morphz "$destination/morphz"
          sh scripts/stage-release-legal.sh "$destination"
          git rev-parse HEAD > "$destination/source-commit.txt"
          file "$destination/morphz"
          (cd "$destination" && shasum -a 256 morphz > morphz.sha256)
      - name: Preserve the native-tested macOS development Runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morphz-macos-development-runtime-${{ runner.arch }}
          path: ${{ runner.temp }}/morphz-macos-development-runtime/
          if-no-files-found: error
          retention-days: 7

  native-sandbox-linux:
    name: Native Sandbox (Linux)
    runs-on: ubuntu-24.04
    env:
      MORPHZ_REQUIRE_LINUX_SANDBOX_ATTACK_TEST: "1"
      MORPHZ_TEST_HOST_NETNS: /opt/morphz-sandbox-ci-host-netns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Install native sandbox dependencies without global security changes
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor apparmor-utils libapparmor-dev libjson-c-dev gcc
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install actual Runtime tests and native policy service
        run: |
          test ! -e "$MORPHZ_TEST_HOST_NETNS"
          sudo install -m 0444 /dev/null "$MORPHZ_TEST_HOST_NETNS"
          sudo mount --bind /proc/self/ns/net "$MORPHZ_TEST_HOST_NETNS"
          cargo test --locked -p morphz --lib --test native_sandbox_contract --no-run --message-format=json > "$RUNNER_TEMP/native-test-artifacts.jsonl"
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B tools/linux-sandbox/stage_runtime_tests.py "$RUNNER_TEMP/native-test-artifacts.jsonl" --install-service
          sudo systemctl daemon-reload
          sudo systemctl start morphz-sandbox.service
          for _ in $(seq 1 100); do
            if [ -S /run/morphz-sandbox/control.sock ]; then break; fi
            sleep 0.1
          done
          test -S /run/morphz-sandbox/control.sock
      - name: Verify installed native execution and unchanged terminal protection contracts
        run: |
          /usr/local/libexec/morphz-runtime-ci/native --nocapture --test-threads=1
          /usr/local/libexec/morphz-runtime-ci/lib terminal::tests::terminal_sandbox_denies_outside_writes_and_protected_files --exact --nocapture --test-threads=1
          /usr/local/libexec/morphz-runtime-ci/lib terminal::tests::terminal_interrupt_keeps_shell_and_resize_is_real --exact --nocapture --test-threads=1

  native-sandbox-windows:
    name: Native Sandbox (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse the PowerShell installers
        shell: pwsh
        run: |
          foreach ($installer in @("scripts/install.ps1", "website/public/install.ps1", "scripts/edge/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $installer),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          if ((Get-FileHash scripts/install.ps1).Hash -ne (Get-FileHash website/public/install.ps1).Hash) {
            throw "The website PowerShell installer is out of sync with scripts/install.ps1."
          }
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify real Windows stable and RC installer behavior
        shell: pwsh
        run: ./scripts/test_install.ps1
      - name: Build Morphz-branded Windows sandbox helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = Join-Path $PWD "target/windows-sandbox-tools"
          New-Item -ItemType Directory -Force $staging | Out-Null

          function Build-And-Collect {
            param(
              [string[]]$CargoArguments,
              [string[]]$RequiredTargets
            )

            $found = @{}
            & cargo @CargoArguments "--message-format=json-render-diagnostics" | ForEach-Object {
              $line = $_
              try {
                $message = $line | ConvertFrom-Json -ErrorAction Stop
              } catch {
                Write-Host $line
                return
              }

              if ($message.reason -eq "compiler-message" -and $message.message.rendered) {
                Write-Host $message.message.rendered
              }
              if (
                $message.reason -eq "compiler-artifact" -and
                $message.executable -and
                $RequiredTargets -contains $message.target.name
              ) {
                $targetName = $message.target.name
                Copy-Item $message.executable (Join-Path $staging "$targetName.exe") -Force
                $found[$targetName] = $true
              }
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Cargo failed with exit code $LASTEXITCODE"
            }

            foreach ($targetName in $RequiredTargets) {
              if (-not $found.ContainsKey($targetName)) {
                throw "Cargo did not report an executable artifact for $targetName"
              }
            }
          }

          Build-And-Collect `
            -CargoArguments @("build", "-p", "morphz", "--bin", "morphz", "--bin", "morphz-edge", "--bin", "morphz-windows-sandbox-runner") `
            -RequiredTargets @("morphz", "morphz-edge", "morphz-windows-sandbox-runner")
          Build-And-Collect `
            -CargoArguments @("build", "-p", "morphz-windows-sandbox", "--bins") `
            -RequiredTargets @("morphz-windows-command-runner", "morphz-windows-sandbox-setup")
          cargo test -p morphz --lib --no-run
      - name: Stage the complete helper bundle beside the Rust test executable
        shell: pwsh
        run: |
          $helpers = @(
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe"
          )
          foreach ($helper in $helpers) {
            $source = Join-Path "target/windows-sandbox-tools" $helper
            if (-not (Test-Path $source)) {
              throw "Missing required Windows sandbox helper: $source"
            }
            Copy-Item $source "target/debug/deps/$helper" -Force
          }
      - name: Verify native Windows filesystem, network, and process-tree boundaries
        shell: pwsh
        run: |
          $env:MORPHZ_RUN_WINDOWS_SANDBOX_ATTACK_TEST = "1"
          cargo test -p morphz sandbox::windows::tests -- --nocapture --test-threads=1
      - name: Verify stable Session IO on Windows
        shell: bash
        run: |
          cargo test --locked -p morphz --lib session_io:: -- --test-threads=1
          cargo test --locked -p morphz --test session_io -- --test-threads=1
      - name: Assemble separate main and Edge Windows bundles
        shell: pwsh
        run: |
          $mainBundle = "target/morphz-windows-bundle"
          $edgeBundle = "target/morphz-edge-windows-bundle"
          New-Item -ItemType Directory -Force $mainBundle, $edgeBundle | Out-Null
          @(
            "morphz.exe",
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe"
          ) | ForEach-Object {
            Copy-Item "target/windows-sandbox-tools/$_" "$mainBundle/$_" -Force
          }
          @(
            "morphz-edge.exe",
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe"
          ) | ForEach-Object {
            Copy-Item "target/windows-sandbox-tools/$_" "$edgeBundle/$_" -Force
          }
          Compress-Archive -Path "$mainBundle/*" -DestinationPath "target/morphz-windows-x86_64.zip" -Force
          Compress-Archive -Path "$edgeBundle/*" -DestinationPath "target/morphz-edge-windows-x86_64.zip" -Force
      - name: Upload verified Windows bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morphz-windows-x86_64
          path: |
            target/morphz-windows-x86_64.zip
            target/morphz-edge-windows-x86_64.zip
          if-no-files-found: error

  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release binary
        run: cargo build --release --workspace
      - name: Require three complete concurrent Provider recovery passes
        run: |
          for round in 1 2 3; do
            python3 scripts/verify-provider-wait.py --binary target/release/morphz --output "$RUNNER_TEMP/provider-wait-$round"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() || cancelled()
        with:
          name: concurrent-provider-wait-failure
          path: |
            ${{ runner.temp }}/provider-wait-*/binary.json
            ${{ runner.temp }}/provider-wait-*/results.json
            ${{ runner.temp }}/provider-wait-*/*/result.json
            ${{ runner.temp }}/provider-wait-*/*/runtime.log
            ${{ runner.temp }}/provider-wait-*/*/waiting.json
            ${{ runner.temp }}/provider-wait-*/*/provider-requests.json
          if-no-files-found: ignore

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Verify patched glob matching and lint export compatibility
        run: node --test ../scripts/tests/minimatch-security.test.mjs
      - name: Verify locked Dashboard license bundle
        working-directory: .
        run: python3 scripts/generate-third-party-licenses.py dashboard --check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # `morphz/src/web.rs` embeds these files with `include_bytes!` at Rust
      # compile time, so they are committed and the Rust jobs need no Node
      # toolchain. The cost of that is a build which can silently fall behind
      # its source: the binary would then serve a UI nobody can find in the
      # tree. Nothing else checks this.
      - name: Verify the embedded dashboard build is current
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git diff -- dist
            git status --porcelain -- dist
            echo "::error::dashboard/dist is stale. Run 'npm run build' in dashboard/ and commit the result."
            exit 1
          fi

  website:
    name: Technical Website
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Verify patched glob matching and lint export compatibility
        run: node --test ../scripts/tests/minimatch-security.test.mjs
      - run: npm run lint
      - run: npm test
      - name: Verify generated documentation is current
        run: |
          if [ -n "$(git status --porcelain -- lib/docs.generated.ts lib/blog.generated.ts lib/standards.generated.ts)" ]; then
            git diff -- lib/docs.generated.ts lib/blog.generated.ts lib/standards.generated.ts
            echo "::error::Generated website documentation, blog or standards are stale. Regenerate and commit them."
            exit 1
          fi
