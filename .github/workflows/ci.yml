name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all --verbose

  postgres-conformance:
    name: PostgreSQL Runtime Store
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphz
          POSTGRES_PASSWORD: morphz
          POSTGRES_DB: morphz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morphz -d morphz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MORPHZ_TEST_POSTGRES_URL: postgres://morphz:morphz@127.0.0.1:5432/morphz_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run PostgreSQL conformance tests
        run: cargo test -p morphz --test runtime_store_conformance -- --nocapture

  native-sandbox-macos:
    name: Native Sandbox (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Verify native sandbox boundary
        run: cargo test -p morphz sandbox::tests -- --nocapture
      - name: Verify one-shot approval boundary
        run: cargo test -p morphz tool::tests::exec_ -- --nocapture

  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --workspace

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
