name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Source language check
        run: bash scripts/check-source-language.sh
      - name: Core protocol language check
        run: perl scripts/check-core-protocol-language.pl
      - name: Diagnostic log contract check
        run: perl scripts/check-diagnostic-logs.pl
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # The workspace contains many evaluation binaries. Linking all of them
      # concurrently with full test debuginfo can exhaust the hosted runner and
      # crash LLD with SIGBUS before any test starts.
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install Bubblewrap for sandboxed integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --unshare-user --unshare-pid --proc /proc -- /bin/true
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all --verbose

  postgres-conformance:
    name: PostgreSQL Runtime Store
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphz
          POSTGRES_PASSWORD: morphz
          POSTGRES_DB: morphz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morphz -d morphz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MORPHZ_TEST_POSTGRES_URL: postgres://morphz:morphz@127.0.0.1:5432/morphz_test
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run PostgreSQL conformance tests
        run: cargo test -p morphz --test runtime_store_conformance -- --nocapture

  native-sandbox-macos:
    name: Native Sandbox (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Verify native sandbox boundary
        run: cargo test -p morphz sandbox::tests -- --nocapture
      - name: Verify one-shot approval boundary
        run: cargo test -p morphz tool::tests::exec_ -- --nocapture

  native-sandbox-linux:
    name: Native Sandbox (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # ubuntu-latest uses Ubuntu 24.04, whose AppArmor default blocks the
          # unprivileged user namespace that Bubblewrap needs. This is an
          # ephemeral dedicated runner; enable the kernel facility so the job
          # exercises Morphz's real mount/network/process boundary.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --unshare-user --unshare-pid --proc /proc -- /bin/true
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Verify sandbox policy contract
        run: cargo test -p morphz sandbox::tests -- --nocapture
      - name: Verify native Bubblewrap attack boundary
        env:
          MORPHZ_REQUIRE_LINUX_SANDBOX_ATTACK_TEST: "1"
        run: cargo test -p morphz sandbox::linux::tests -- --nocapture
      - name: Verify exec permission boundary
        run: cargo test -p morphz tool::tests::exec_ -- --nocapture

  native-sandbox-windows:
    name: Native Sandbox (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build Morphz and the pinned Codex sandbox helpers
        run: |
          cargo build -p morphz --bin morphz --bin morphz-edge --bin morphz-windows-sandbox-runner
          cargo build -p codex-windows-sandbox --bins
          cargo test -p morphz --lib --no-run
      - name: Stage the complete helper bundle beside the Rust test executable
        shell: pwsh
        run: |
          $helpers = @(
            "morphz-windows-sandbox-runner.exe",
            "codex-command-runner.exe",
            "codex-windows-sandbox-setup.exe"
          )
          foreach ($helper in $helpers) {
            $source = Join-Path "target/debug" $helper
            if (-not (Test-Path $source)) {
              throw "Missing required Windows sandbox helper: $source"
            }
            Copy-Item $source "target/debug/deps/$helper" -Force
          }
      - name: Verify native Windows filesystem, network, and process-tree boundaries
        shell: pwsh
        run: |
          $env:MORPHZ_RUN_WINDOWS_SANDBOX_ATTACK_TEST = "1"
          cargo test -p morphz sandbox::windows::tests -- --nocapture --test-threads=1
      - name: Assemble installable Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "target/morphz-windows-bundle" | Out-Null
          $binaries = @(
            "morphz.exe",
            "morphz-edge.exe",
            "morphz-windows-sandbox-runner.exe",
            "codex-command-runner.exe",
            "codex-windows-sandbox-setup.exe"
          )
          foreach ($binary in $binaries) {
            Copy-Item "target/debug/$binary" "target/morphz-windows-bundle/$binary" -Force
          }
          Compress-Archive -Path "target/morphz-windows-bundle/*" -DestinationPath "target/morphz-windows-x86_64.zip" -Force
      - name: Upload verified Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: morphz-windows-x86_64
          path: target/morphz-windows-x86_64.zip
          if-no-files-found: error

  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --workspace

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # `morphz/src/web.rs` embeds these files with `include_bytes!` at Rust
      # compile time, so they are committed and the Rust jobs need no Node
      # toolchain. The cost of that is a build which can silently fall behind
      # its source: the binary would then serve a UI nobody can find in the
      # tree. Nothing else checks this.
      - name: Verify the embedded dashboard build is current
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git diff -- dist
            git status --porcelain -- dist
            echo "::error::dashboard/dist is stale. Run 'npm run build' in dashboard/ and commit the result."
            exit 1
          fi
