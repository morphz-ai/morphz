name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Audit Rust dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          bash scripts/audit-rust-dependencies.sh
      - name: Verify locked Rust license bundle
        run: python3 scripts/generate-third-party-licenses.py rust --check
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Source language check
        run: bash scripts/check-source-language.sh
      - name: Core protocol language check
        run: perl scripts/check-core-protocol-language.pl
      - name: Diagnostic log contract check
        run: perl scripts/check-diagnostic-logs.pl
      - name: Signed Edge installer contract
        run: sh scripts/edge/test_install.sh
      - name: Main release installer contract
        run: |
          cmp scripts/install.sh website/public/install.sh
          sh scripts/test_install.sh
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # The workspace contains many evaluation binaries. Linking all of them
      # concurrently with full test debuginfo can exhaust the hosted runner and
      # crash LLD with SIGBUS before any test starts.
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Install Bubblewrap for sandboxed integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --unshare-user --unshare-pid --proc /proc -- /bin/true
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        # Runtime tests exercise real SQLite transactions, timers, sockets,
        # and process groups. Compile in parallel above, but run test cases in
        # a deterministic order so hosted-runner scheduling cannot manufacture
        # database-lock and wall-clock failures between otherwise isolated
        # harnesses. Tests that verify concurrency still spawn it internally.
        run: cargo test --all --verbose -- --test-threads=1

  postgres-conformance:
    name: PostgreSQL Runtime Store
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphz
          POSTGRES_PASSWORD: morphz
          POSTGRES_DB: morphz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morphz -d morphz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MORPHZ_TEST_POSTGRES_URL: postgres://morphz:morphz@127.0.0.1:5432/morphz_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run PostgreSQL conformance tests
        run: cargo test -p morphz --test runtime_store_conformance -- --nocapture

  native-sandbox-macos:
    name: Native Sandbox (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify native sandbox boundary
        run: cargo test -p morphz sandbox::tests -- --nocapture
      - name: Verify one-shot approval boundary
        run: cargo test -p morphz tool::tests::exec_ -- --nocapture
      - name: Verify signed Edge installer contract
        run: sh scripts/edge/test_install.sh

  native-sandbox-linux:
    name: Native Sandbox (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # ubuntu-latest uses Ubuntu 24.04, whose AppArmor default blocks the
          # unprivileged user namespace that Bubblewrap needs. This is an
          # ephemeral dedicated runner; enable the kernel facility so the job
          # exercises Morphz's real mount/network/process boundary.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --unshare-user --unshare-pid --proc /proc -- /bin/true
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify native Bubblewrap execution contract
        # Keep the platform probe small and real: compiling every unit test into
        # one lib-test executable can require several GiB before this Linux-only
        # boundary runs. The workspace test job above still runs the full suite.
        run: cargo test -p morphz --test native_sandbox_contract -- --nocapture

  native-sandbox-windows:
    name: Native Sandbox (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Parse the PowerShell installers
        shell: pwsh
        run: |
          foreach ($installer in @("scripts/install.ps1", "website/public/install.ps1", "scripts/edge/install.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $installer),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          if ((Get-FileHash scripts/install.ps1).Hash -ne (Get-FileHash website/public/install.ps1).Hash) {
            throw "The website PowerShell installer is out of sync with scripts/install.ps1."
          }
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build Morphz-branded Windows sandbox helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = Join-Path $PWD "target/windows-sandbox-tools"
          New-Item -ItemType Directory -Force $staging | Out-Null

          function Build-And-Collect {
            param(
              [string[]]$CargoArguments,
              [string[]]$RequiredTargets
            )

            $found = @{}
            & cargo @CargoArguments "--message-format=json-render-diagnostics" | ForEach-Object {
              $line = $_
              try {
                $message = $line | ConvertFrom-Json -ErrorAction Stop
              } catch {
                Write-Host $line
                return
              }

              if ($message.reason -eq "compiler-message" -and $message.message.rendered) {
                Write-Host $message.message.rendered
              }
              if (
                $message.reason -eq "compiler-artifact" -and
                $message.executable -and
                $RequiredTargets -contains $message.target.name
              ) {
                $targetName = $message.target.name
                Copy-Item $message.executable (Join-Path $staging "$targetName.exe") -Force
                $found[$targetName] = $true
              }
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Cargo failed with exit code $LASTEXITCODE"
            }

            foreach ($targetName in $RequiredTargets) {
              if (-not $found.ContainsKey($targetName)) {
                throw "Cargo did not report an executable artifact for $targetName"
              }
            }
          }

          Build-And-Collect `
            -CargoArguments @("build", "-p", "morphz", "--bin", "morphz", "--bin", "morphz-edge", "--bin", "morphz-windows-sandbox-runner") `
            -RequiredTargets @("morphz", "morphz-edge", "morphz-windows-sandbox-runner")
          Build-And-Collect `
            -CargoArguments @("build", "-p", "morphz-windows-sandbox", "--bins") `
            -RequiredTargets @("morphz-windows-command-runner", "morphz-windows-sandbox-setup")
          cargo test -p morphz --lib --no-run
      - name: Stage the complete helper bundle beside the Rust test executable
        shell: pwsh
        run: |
          $helpers = @(
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe"
          )
          foreach ($helper in $helpers) {
            $source = Join-Path "target/windows-sandbox-tools" $helper
            if (-not (Test-Path $source)) {
              throw "Missing required Windows sandbox helper: $source"
            }
            Copy-Item $source "target/debug/deps/$helper" -Force
          }
      - name: Verify native Windows filesystem, network, and process-tree boundaries
        shell: pwsh
        run: |
          $env:MORPHZ_RUN_WINDOWS_SANDBOX_ATTACK_TEST = "1"
          cargo test -p morphz sandbox::windows::tests -- --nocapture --test-threads=1
      - name: Assemble separate main and Edge Windows bundles
        shell: pwsh
        run: |
          $mainBundle = "target/morphz-windows-bundle"
          $edgeBundle = "target/morphz-edge-windows-bundle"
          New-Item -ItemType Directory -Force $mainBundle, $edgeBundle | Out-Null
          @(
            "morphz.exe",
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe"
          ) | ForEach-Object {
            Copy-Item "target/windows-sandbox-tools/$_" "$mainBundle/$_" -Force
          }
          @(
            "morphz-edge.exe",
            "morphz-windows-sandbox-runner.exe",
            "morphz-windows-command-runner.exe",
            "morphz-windows-sandbox-setup.exe"
          ) | ForEach-Object {
            Copy-Item "target/windows-sandbox-tools/$_" "$edgeBundle/$_" -Force
          }
          Compress-Archive -Path "$mainBundle/*" -DestinationPath "target/morphz-windows-x86_64.zip" -Force
          Compress-Archive -Path "$edgeBundle/*" -DestinationPath "target/morphz-edge-windows-x86_64.zip" -Force
      - name: Upload verified Windows bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morphz-windows-x86_64
          path: |
            target/morphz-windows-x86_64.zip
            target/morphz-edge-windows-x86_64.zip
          if-no-files-found: error

  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release binary
        run: cargo build --release --workspace

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Verify locked Dashboard license bundle
        working-directory: .
        run: python3 scripts/generate-third-party-licenses.py dashboard --check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # `morphz/src/web.rs` embeds these files with `include_bytes!` at Rust
      # compile time, so they are committed and the Rust jobs need no Node
      # toolchain. The cost of that is a build which can silently fall behind
      # its source: the binary would then serve a UI nobody can find in the
      # tree. Nothing else checks this.
      - name: Verify the embedded dashboard build is current
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git diff -- dist
            git status --porcelain -- dist
            echo "::error::dashboard/dist is stale. Run 'npm run build' in dashboard/ and commit the result."
            exit 1
          fi

  website:
    name: Technical Website
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm test
      - name: Verify generated documentation is current
        run: |
          if [ -n "$(git status --porcelain -- lib/docs.generated.ts)" ]; then
            git diff -- lib/docs.generated.ts
            echo "::error::website/lib/docs.generated.ts is stale. Regenerate and commit it."
            exit 1
          fi
