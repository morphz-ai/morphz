name: Application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-startup-diagnostic:
    name: Isolated native Reader persistence diagnostic
    runs-on: macos-26-intel
    timeout-minutes: 25
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Select isolated cognitive dependency cache
        run: printf 'MORPHZ_TEST_COGNITIVE_NPM_CACHE=%s/morphz-cognitive-npm-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix ../dashboard
      - run: npm exec --offline -- tsx scripts/prepare-cognitive-author-dependencies.ts
      - run: node node_modules/electron/install.js
      - run: npm run build
      - run: npx playwright install chromium
      - name: Verify five remote and embedded reader journeys without retries
        shell: bash
        run: |
          mkdir -p test-results/native-reader-stability
          for mode in remote embedded; do
            for round in 1 2 3 4 5; do
              log="test-results/native-reader-stability/${mode}-${round}.log"
              args=()
              if [[ "$mode" == embedded ]]; then args+=(--embedded); fi
              status=0
              node scripts/platform-desktop-smoke.mjs "${args[@]}" > "$log" 2>&1 || status=$?
              cat "$log"
              if [[ "$status" != 0 ]]; then exit "$status"; fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-reader-stability
          path: application/test-results/
          if-no-files-found: error
          retention-days: 3
