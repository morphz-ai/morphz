name: Event notification diagnosis

on:
  workflow_dispatch:
    inputs:
      prefix_only:
        description: Diagnose the exact original-order library prefix ending at the notification case
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Exact installed Linux event notification diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphz
          POSTGRES_PASSWORD: morphz
          POSTGRES_DB: morphz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morphz -d morphz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_BUILD_JOBS: 2
      MORPHZ_TEST_POSTGRES_URL: postgres://morphz:morphz@127.0.0.1:5432/morphz_test
      MORPHZ_REQUIRE_LINUX_SANDBOX_ATTACK_TEST: "1"
      MORPHZ_TEST_HOST_NETNS: /opt/morphz-sandbox-ci-host-netns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install the unchanged distribution sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor apparmor-utils libapparmor-dev libjson-c-dev gcc
      - name: Compile the exact complete Root workspace test inventory
        run: cargo test --locked --all --no-run --message-format=json > "$RUNNER_TEMP/runtime-test-artifacts.jsonl"
      - name: Install the same exact test images and native service as Root CI
        run: |
          test ! -e "$MORPHZ_TEST_HOST_NETNS"
          sudo install -m 0444 /dev/null "$MORPHZ_TEST_HOST_NETNS"
          sudo mount --bind /proc/self/ns/net "$MORPHZ_TEST_HOST_NETNS"
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B tools/linux-sandbox/stage_runtime_tests.py "$RUNNER_TEMP/runtime-test-artifacts.jsonl" --workspace --install-service
          sudo systemctl daemon-reload
          sudo systemctl start morphz-sandbox.service
          for _ in $(seq 1 100); do
            if [ -S /run/morphz-sandbox/control.sock ]; then break; fi
            sleep 0.1
          done
          test -S /run/morphz-sandbox/control.sock
      - name: Diagnose five original-order prefixes through the notification case
        if: ${{ inputs.prefix_only }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/event-notification-evidence"
          for round in 1 2 3 4 5; do
            python3 - <<'PYTHON' 2>&1 | tee "$RUNNER_TEMP/event-notification-evidence/prefix-$round.log"
          import subprocess
          binary = "/usr/local/libexec/morphz-runtime-ci/lib"
          target = "memory::event_changes::tests::sqlite_peer_commits_wake_without_a_database_poll"
          inventory = subprocess.run([binary, "--list"], check=True, text=True, stdout=subprocess.PIPE).stdout
          assert len(inventory.encode()) <= 2 * 1024 * 1024
          names = sorted(line.removesuffix(": test") for line in inventory.splitlines() if line.endswith(": test"))
          assert 0 < len(names) <= 10000 and names.count(target) == 1
          selected = names[:names.index(target) + 1]
          print(f"Original-order prefix: {len(selected)} of {len(names)} library tests, ending exactly at {target}", flush=True)
          subprocess.run([binary, "--exact", "--test-threads=1", *selected], check=True)
          PYTHON
          done
      - name: Diagnose the unchanged complete Root test order with child commit evidence
        if: ${{ !inputs.prefix_only }}
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/python3 -I -B ${{ github.workspace }}/tools/linux-sandbox/run_runtime_test.py
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/event-notification-evidence"
          ./scripts/cargo-dev.sh test --locked --all --verbose --no-fail-fast -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/event-notification-evidence/root-workspace.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: event-notification-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/event-notification-evidence/
          retention-days: 7
