name: Event notification diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Exact installed Linux event notification diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      MORPHZ_REQUIRE_LINUX_SANDBOX_ATTACK_TEST: "1"
      MORPHZ_TEST_HOST_NETNS: /opt/morphz-sandbox-ci-host-netns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install the unchanged distribution sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor apparmor-utils libapparmor-dev libjson-c-dev gcc
      - name: Compile the exact Runtime library and native contract images
        run: cargo test --locked -p morphz --lib --test native_sandbox_contract --no-run --message-format=json > "$RUNNER_TEMP/runtime-test-artifacts.jsonl"
      - name: Install the same exact test images and native service as Root CI
        run: |
          test ! -e "$MORPHZ_TEST_HOST_NETNS"
          sudo install -m 0444 /dev/null "$MORPHZ_TEST_HOST_NETNS"
          sudo mount --bind /proc/self/ns/net "$MORPHZ_TEST_HOST_NETNS"
          sudo env MORPHZ_LINUX_SANDBOX_TEST=1 /usr/bin/python3 -I -B tools/linux-sandbox/stage_runtime_tests.py "$RUNNER_TEMP/runtime-test-artifacts.jsonl" --install-service
          sudo systemctl daemon-reload
          sudo systemctl start morphz-sandbox.service
          for _ in $(seq 1 100); do
            if [ -S /run/morphz-sandbox/control.sock ]; then break; fi
            sleep 0.1
          done
          test -S /run/morphz-sandbox/control.sock
      - name: Diagnose twenty independent event notification suites without retries
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/python3 -I -B ${{ github.workspace }}/tools/linux-sandbox/run_runtime_test.py
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/event-notification-evidence"
          for round in $(seq 1 20); do
            log="$RUNNER_TEMP/event-notification-evidence/pass-$round.log"
            cargo test --locked -p morphz --lib memory::event_changes::tests:: -- --test-threads=1 --nocapture 2>&1 | tee "$log"
            python3 -c 'import pathlib,re,sys; text=re.sub(r"\x1b\[[0-9;]*[mK]", "", pathlib.Path(sys.argv[1]).read_text()); assert "test result: ok. 3 passed; 0 failed; 1 ignored;" in text' "$log"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: event-notification-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/event-notification-evidence/
          retention-days: 7
