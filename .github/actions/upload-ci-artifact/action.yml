name: Upload CI artifact with bounded transport recovery
description: Upload the same completed evidence through the pinned official action, with at most three attempts.
inputs:
  name:
    description: Artifact name
    default: artifact
  path:
    description: Completed files to upload
    required: true
  if-no-files-found:
    description: Original missing-file policy
    default: warn
  retention-days:
    description: Original retention policy; zero retains the repository default
    default: "0"
  compression-level:
    description: Original archive compression level
    default: "6"
  include-hidden-files:
    description: Original hidden-file policy
    default: "false"
  archive:
    description: Original archive policy
    default: "true"
outputs:
  artifact-id:
    description: ID from a confirmed successful upload
    value: ${{ (steps.first.outcome == 'success' && steps.first.outputs.artifact-id) || (steps.second.outcome == 'success' && steps.second.outputs.artifact-id) || (steps.third.outcome == 'success' && steps.third.outputs.artifact-id) || '' }}
  artifact-url:
    description: URL from a confirmed successful upload
    value: ${{ (steps.first.outcome == 'success' && steps.first.outputs.artifact-url) || (steps.second.outcome == 'success' && steps.second.outputs.artifact-url) || (steps.third.outcome == 'success' && steps.third.outputs.artifact-url) || '' }}
  artifact-digest:
    description: Digest from a confirmed successful upload
    value: ${{ (steps.first.outcome == 'success' && steps.first.outputs.artifact-digest) || (steps.second.outcome == 'success' && steps.second.outputs.artifact-digest) || (steps.third.outcome == 'success' && steps.third.outputs.artifact-digest) || '' }}
runs:
  using: composite
  steps:
    - name: Upload completed evidence
      id: first
      if: ${{ always() }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
    - name: Wait before transport recovery
      if: ${{ always() && steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 15
    - name: Recover the same evidence upload
      id: second
      if: ${{ always() && steps.first.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
    - name: Wait before final transport attempt
      if: ${{ always() && steps.first.outcome == 'failure' && steps.second.outcome == 'failure' }}
      shell: bash
      run: sleep 30
    - name: Require the final upload attempt
      id: third
      if: ${{ always() && steps.first.outcome == 'failure' && steps.second.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
    - name: Require confirmed artifact upload
      if: ${{ always() }}
      shell: bash
      env:
        UPLOAD_FIRST: ${{ steps.first.outcome }}
        UPLOAD_SECOND: ${{ steps.second.outcome }}
        UPLOAD_THIRD: ${{ steps.third.outcome }}
      run: |
        for outcome in "$UPLOAD_FIRST" "$UPLOAD_SECOND" "$UPLOAD_THIRD"; do
          case "$outcome" in
            success|failure|skipped|cancelled) ;;
            *) printf '%s\n' 'Missing or invalid artifact upload outcome' >&2; exit 2 ;;
          esac
        done
        if [ "$UPLOAD_FIRST" = success ] || [ "$UPLOAD_SECOND" = success ] || [ "$UPLOAD_THIRD" = success ]; then
          exit 0
        fi
        printf '%s\n' 'Artifact upload failed after bounded transport recovery' >&2
        exit 1
