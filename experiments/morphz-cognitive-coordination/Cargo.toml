[package]
name = "morphz-cognitive-coordination"
version = "0.0.1"
edition = "2021"
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.35", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.8"

[lints]
workspace = true
