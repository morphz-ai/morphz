[package]
name = "morphz-response-annotations-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "response-annotations-probe"
path = "src/main.rs"

# This is an isolated experiment, not another production Runtime member.
[workspace]

# Cargo patches apply only at the workspace root. This isolated experiment
# must preserve Morphz's audited Windows protocol-only boundary too; otherwise
# its lockfile resolves Codex's unused proxy, DNS and telemetry implementations.
[patch."https://github.com/openai/codex"]
codex-otel = { path = "../../third_party/codex-otel-stub" }
codex-network-proxy = { path = "../../third_party/codex-network-proxy-stub" }
codex-utils-absolute-path = { path = "../../third_party/codex-utils-absolute-path" }
codex-utils-pty = { path = "../../third_party/codex-utils-pty" }

[dependencies]
morphz = { path = "../../morphz" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
toml = "0.8"
url = "2"
