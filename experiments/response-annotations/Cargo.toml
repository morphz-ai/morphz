[package]
name = "morphz-response-annotations-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "response-annotations-probe"
path = "src/main.rs"

# This is an isolated experiment, not another production Runtime member.
[workspace]

[dependencies]
morphz = { path = "../../morphz" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
toml = "0.8"
url = "2"
