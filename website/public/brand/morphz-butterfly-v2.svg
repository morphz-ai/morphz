      <path d="M8 4C8 25 13 40 25 47C18 37 12 19 8 4Z" fill="#d0fffa" fill-opacity="0.28"/>
      <path d="M8 92C18 81 25 70 34 64C24 73 15 84 8 92Z" fill="#c8fff5" fill-opacity="0.18"/>
