      <stop offset="0.38" stop-color="#56d0de"/>
      <stop offset="0.72" stop-color="#2cb8cc"/>
      <stop offset="1" stop-color="#14899f"/>
    </linearGradient>
    <g id="morphz-butterfly-v2-wing">
