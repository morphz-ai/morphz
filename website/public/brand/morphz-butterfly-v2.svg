<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="morphz-butterfly-v2-title morphz-butterfly-v2-desc">
  <title id="morphz-butterfly-v2-title">Morphz butterfly, M silhouette</title>
  <desc id="morphz-butterfly-v2-desc">The Morphz M with its pointed tips and central doorway preserved. Curved outer edges suggest butterfly wings.</desc>
