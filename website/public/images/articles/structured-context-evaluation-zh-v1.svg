<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">structured-context-evaluation</title><desc id="desc">模型对结构化上下文的有界视图求值，提出事务与动作；运行时验证后提交认知变更并调度执行。工具结果成为新的观察，后续求值从更新后的状态继续。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#56d0de" stroke-width="1.5"/></marker></defs><g font-family="Arial, 'Hiragino Sans GB', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect width="1200" height="800" fill="#0c1419"/><text x="48" y="65" font-size="38" fill="#eef5f6" font-weight="600" text-anchor="start">结构化上下文求值</text><text x="48" y="765" font-size="25" fill="#afc1ca" font-weight="400" text-anchor="start">模型作判断；运行时验证、提交并执行。</text><rect x="48" y="140" width="300" height="180" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="72" y="185" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">结构化上下文</text><text x="72" y="239" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">观察 · 认知 · 运行状态</text><text x="72" y="283" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">具有身份与版本</text><rect x="450" y="140" width="300" height="180" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="474" y="185" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">模型求值</text><text x="474" y="239" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">理解当前上下文</text><text x="474" y="283" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">提出事务与下一步动作</text><rect x="852" y="140" width="300" height="180" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="876" y="185" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">运行时验证</text><text x="876" y="239" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">检查版本与权限</text><text x="876" y="283" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">守住因果与资源边界</text><rect x="48" y="465" width="300" height="180" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="72" y="510" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">新的观察记录</text><text x="72" y="564" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">工具结果与外部事件</text><text x="72" y="608" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">进入后续求值</text><rect x="450" y="465" width="300" height="180" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="474" y="510" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">工具与线程执行</text><text x="474" y="564" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">按权限与依赖推进</text><text x="474" y="608" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">独立工作可以并行</text><rect x="852" y="465" width="300" height="180" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="876" y="510" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">上下文状态更新</text><text x="876" y="564" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">认知更新以事务提交</text><text x="876" y="608" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">供后续求值读取</text><path d="M352 230L443 230" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="398" y="211" font-size="22" fill="#56d0de" font-weight="400" text-anchor="middle">有界视图</text><path d="M754 230L845 230" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="800" y="211" font-size="22" fill="#56d0de" font-weight="400" text-anchor="middle">提出变更</text><path d="M1078 324L1078 458" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1093" y="395" font-size="22" fill="#56d0de" font-weight="400" text-anchor="start">提交</text><path d="M949 324L949 381L600 381L600 458" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="759" y="365" font-size="23" fill="#56d0de" font-weight="400" text-anchor="middle">调度动作</text><path d="M446 555L355 555" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="400" y="536" font-size="22" fill="#56d0de" font-weight="400" text-anchor="middle">结果</text><path d="M198 461L198 327" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="213" y="403" font-size="23" fill="#56d0de" font-weight="400" text-anchor="start">进入上下文</text><rect x="286" y="684" width="628" height="42" rx="21" fill="#244a56"/><text x="600" y="713" font-size="23" fill="#56d0de" font-weight="600" text-anchor="middle">上下文持续存在，后续求值从新状态继续</text></g></svg>