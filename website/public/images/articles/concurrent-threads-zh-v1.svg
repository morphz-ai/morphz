<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">concurrent-threads</title><desc id="desc">同一个智能体并发推进测试、兼容性检查与发布说明。测试等待工具时，其他线程继续工作；所需结果汇合后再检查并继续。线程共享已提交的认知状态。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#56d0de" stroke-width="1.5"/></marker></defs><g font-family="Arial, 'Hiragino Sans GB', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect width="1200" height="725" fill="#0c1419"/><text x="48" y="65" font-size="38" fill="#eef5f6" font-weight="600" text-anchor="start">测试在等待，其他线程继续工作</text><text x="48" y="690" font-size="25" fill="#afc1ca" font-weight="400" text-anchor="start">同一个智能体，通过 schedule_tx 安排线程与依赖。时间仅作示意。</text><text x="48" y="129" font-size="27" fill="#afc1ca" font-weight="400" text-anchor="start">准备一次发布</text><text x="830" y="129" font-size="23" fill="#afc1ca" font-weight="400" text-anchor="end">时间 →</text><path d="M280 156V478" stroke="#37515c" stroke-dasharray="3 8"/><path d="M460 156V478" stroke="#37515c" stroke-dasharray="3 8"/><path d="M640 156V478" stroke="#37515c" stroke-dasharray="3 8"/><path d="M820 156V478" stroke="#37515c" stroke-dasharray="3 8"/><text x="48" y="234" font-size="28" fill="#eef5f6" font-weight="600" text-anchor="start">测试线程</text><rect x="280" y="190" width="548" height="70" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="554" y="234" font-size="25" fill="#afc1ca" font-weight="400" text-anchor="middle">启动测试 → 等待工具结果</text><text x="48" y="344" font-size="28" fill="#eef5f6" font-weight="600" text-anchor="start">兼容性线程</text><rect x="280" y="300" width="443" height="70" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="501.5" y="344" font-size="25" fill="#56d0de" font-weight="400" text-anchor="middle">检查平台 → 完成</text><text x="48" y="454" font-size="28" fill="#eef5f6" font-weight="600" text-anchor="start">文档线程</text><rect x="280" y="410" width="360" height="70" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="460" y="454" font-size="25" fill="#56d0de" font-weight="400" text-anchor="middle">整理说明 → 完成</text><rect x="950" y="179" width="202" height="311" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="1051" y="227" font-size="28" fill="#eef5f6" font-weight="600" text-anchor="middle">汇合结果</text><text x="1051" y="294" font-size="25" fill="#afc1ca" font-weight="400" text-anchor="middle">等待所需结果</text><text x="1051" y="334" font-size="25" fill="#56d0de" font-weight="500" text-anchor="middle">再检查与决策</text><text x="1051" y="442" font-size="25" fill="#56d0de" font-weight="500" text-anchor="middle">继续后续工作</text><path d="M832 225L943 225" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M727 335L943 335" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M644 445L943 445" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="542" width="1104" height="101" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="76" y="583" font-size="30" fill="#56d0de" font-weight="600" text-anchor="start">共享认知上下文</text><text x="76" y="620" font-size="25" fill="#eef5f6" font-weight="400" text-anchor="start">线程读取已提交的状态，并通过上下文事务维护它。</text></g></svg>