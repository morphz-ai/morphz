<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="en"><title id="title">structured-context-evaluation</title><desc id="desc">The model evaluates a bounded view of structured context and proposes transactions and actions. The runtime validates cognitive commits and execution requests. Tool results become new observations; later evaluations read the updated state.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#56d0de" stroke-width="1.5"/></marker></defs><g font-family="Arial, 'Hiragino Sans GB', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect width="1200" height="800" fill="#0c1419"/><text x="48" y="65" font-size="38" fill="#eef5f6" font-weight="600" text-anchor="start">Structured Context Evaluation</text><text x="48" y="765" font-size="25" fill="#afc1ca" font-weight="400" text-anchor="start">The model decides; the runtime validates, commits and executes.</text><rect x="48" y="140" width="300" height="180" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="72" y="185" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">Structured context</text><text x="72" y="239" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Observations · Cognition</text><text x="72" y="283" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Runtime state · Identity</text><rect x="450" y="140" width="300" height="180" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="474" y="185" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">Model evaluation</text><text x="474" y="239" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Interpret current state</text><text x="474" y="283" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Propose next steps</text><rect x="852" y="140" width="300" height="180" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="876" y="185" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">Runtime validation</text><text x="876" y="239" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Versions · Permissions</text><text x="876" y="283" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Causality · Limits</text><rect x="48" y="465" width="300" height="180" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="72" y="510" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">New observations</text><text x="72" y="564" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Tool results and events</text><text x="72" y="608" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Input for later evaluation</text><rect x="450" y="465" width="300" height="180" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="474" y="510" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">Tools and threads</text><text x="474" y="564" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Scope / Dependencies</text><text x="474" y="608" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Work can run in parallel</text><rect x="852" y="465" width="300" height="180" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="876" y="510" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">Context updated</text><text x="876" y="564" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Commit cognition</text><text x="876" y="608" font-size="22" fill="#afc1ca" font-weight="400" text-anchor="start">Read on later evaluations</text><path d="M352 230L443 230" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="398" y="211" font-size="22" fill="#56d0de" font-weight="400" text-anchor="middle">View</text><path d="M754 230L845 230" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="800" y="211" font-size="22" fill="#56d0de" font-weight="400" text-anchor="middle">Propose</text><path d="M1078 324L1078 458" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1093" y="395" font-size="22" fill="#56d0de" font-weight="400" text-anchor="start">Commit</text><path d="M949 324L949 381L600 381L600 458" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="759" y="365" font-size="23" fill="#56d0de" font-weight="400" text-anchor="middle">Schedule actions</text><path d="M446 555L355 555" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="400" y="536" font-size="22" fill="#56d0de" font-weight="400" text-anchor="middle">Results</text><path d="M198 461L198 327" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="213" y="403" font-size="23" fill="#56d0de" font-weight="400" text-anchor="start">Observe</text><rect x="286" y="684" width="628" height="42" rx="21" fill="#244a56"/><text x="600" y="713" font-size="23" fill="#56d0de" font-weight="600" text-anchor="middle">Persistent context. Continue from the updated state.</text></g></svg>