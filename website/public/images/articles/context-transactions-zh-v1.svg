<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">context-transactions</title><desc id="desc">配置检查确认部署地区为上海。智能体提交上下文事务，创建新判断、关联来源并退役已处理内容。上下文从 v17 更新到 v18，其他认知不变，历史记录仍可召回。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#56d0de" stroke-width="1.5"/></marker></defs><g font-family="Arial, 'Hiragino Sans GB', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect width="1200" height="735" fill="#0c1419"/><text x="48" y="65" font-size="38" fill="#eef5f6" font-weight="600" text-anchor="start">一次上下文事务</text><text x="48" y="700" font-size="25" fill="#afc1ca" font-weight="400" text-anchor="start">退出活动上下文的记录仍保留在历史中，需要时可以召回。</text><rect x="450" y="109" width="300" height="89" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="600" y="143" font-size="23" fill="#afc1ca" font-weight="400" text-anchor="middle">新配置 · @e42</text><text x="600" y="181" font-size="29" fill="#56d0de" font-weight="600" text-anchor="middle">部署地区：上海</text><path d="M600 202L600 251" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="258" width="300" height="294" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="72" y="303" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">当前上下文</text><text x="72" y="344" font-size="24" fill="#afc1ca" font-weight="400" text-anchor="start">v17</text><text x="72" y="390" font-size="25" fill="#afc1ca" font-weight="400" text-anchor="start">部署地区</text><text x="72" y="446" font-size="42" fill="#e4bd82" font-weight="600" text-anchor="start">杭州</text><path d="M72 472L324 472" fill="none" stroke="#37515c" stroke-width="2.5" stroke-linejoin="round"/><text x="72" y="513" font-size="23" fill="#afc1ca" font-weight="400" text-anchor="start">其他认知不变</text><rect x="852" y="258" width="300" height="294" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="876" y="303" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">更新后</text><text x="876" y="344" font-size="24" fill="#afc1ca" font-weight="400" text-anchor="start">v18</text><text x="876" y="390" font-size="25" fill="#afc1ca" font-weight="400" text-anchor="start">部署地区</text><text x="876" y="446" font-size="42" fill="#56d0de" font-weight="600" text-anchor="start">上海</text><path d="M876 472L1128 472" fill="none" stroke="#37515c" stroke-width="2.5" stroke-linejoin="round"/><text x="876" y="513" font-size="23" fill="#afc1ca" font-weight="400" text-anchor="start">其他认知不变</text><rect x="450" y="258" width="300" height="294" rx="18" fill="#17333d" stroke="#488997" stroke-width="1.5"/><text x="474" y="303" font-size="27" fill="#eef5f6" font-weight="600" text-anchor="start">智能体提交事务</text><text x="474" y="348" font-size="27" fill="#56d0de" font-weight="600" text-anchor="start">context_tx</text><text x="474" y="403" font-size="23" fill="#eef5f6" font-weight="400" text-anchor="start">创建新的判断</text><text x="474" y="449" font-size="23" fill="#eef5f6" font-weight="400" text-anchor="start">关联来源与替代关系</text><text x="474" y="495" font-size="23" fill="#eef5f6" font-weight="400" text-anchor="start">退役已处理内容</text><path d="M352 416L443 416" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="398" y="396" font-size="22" fill="#56d0de" font-weight="400" text-anchor="middle">读取</text><path d="M754 416L845 416" fill="none" stroke="#56d0de" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="800" y="396" font-size="22" fill="#56d0de" font-weight="400" text-anchor="middle">提交</text><rect x="48" y="595" width="1104" height="68" rx="18" fill="#16252d" stroke="#37515c" stroke-width="1.5"/><text x="600" y="639" font-size="27" fill="#eef5f6" font-weight="500" text-anchor="middle">运行时验证后整组提交；未通过验证则不提交。</text></g></svg>