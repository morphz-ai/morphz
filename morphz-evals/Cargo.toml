[package]
name = "morphz-evals"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
context-db = ["morphz/context-db"]

[[bin]]
name = "context_db_postgres_runtime_benchmark"
path = "src/bin/context_db_postgres_runtime_benchmark.rs"
required-features = ["context-db"]

[[bin]]
name = "context_db_postgres_concurrency_benchmark"
path = "src/bin/context_db_postgres_concurrency_benchmark.rs"
required-features = ["context-db"]

[dependencies]
morphz = { path = "../morphz" }
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"
tempfile = "3.8"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]

[lints]
workspace = true
