[package]
name = "morphz-evals"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
morphz = { path = "../morphz" }
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"
tempfile = "3.8"

[dev-dependencies]
