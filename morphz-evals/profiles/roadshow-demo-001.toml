# DEMO-001-only Morphz profile.
#
# This layer deliberately rebinds the logical gpt-5.6-sol route to the existing
# CLIProxyAPI-compatible `custom` service/account from ~/.morphz/morphz.toml.
# It contains no endpoint or credential and must not mutate the active profile.

[llm]
model = "gpt-5.6-sol"
reasoning_effort = "max"

[models."gpt-5.6-sol"]
service = "custom"
account = "custom-default"
physical_model = "gpt-5.6-sol"
