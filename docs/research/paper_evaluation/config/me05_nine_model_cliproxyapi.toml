[llm]
model = "gpt-5.6-sol"
reasoning_effort = "max"

[credentials.custom]
source = "env"
name = "MORPHZ_PROVIDER_API_KEY"

[accounts.custom-default]
auth_adapter = "credential"
credential_ref = "custom"
provider = "custom"

[services.custom]
adapter = "protocol-compatible"
protocol = "openai-responses"
base_url = "http://mini-m4.local:8317/v1"
accounts = ["custom-default"]

[models."gpt-5.6-sol"]
service = "custom"
account = "custom-default"
physical_model = "gpt-5.6-sol"

[models."claude-opus-5"]
service = "custom"
account = "custom-default"
physical_model = "claude-opus-5"

